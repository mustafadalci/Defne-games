<script type="module">
import * as THREE from './vendor/three.module.min.js';

const { $, state, P, M, horse, baby, PLACES, ZONES, PLAY, doorOf, nisanPos, NISAN_LOOK, SOUND, later, boardOn } = Stad;
const riding = () => Stad.riding();

// Map units (the 2D map's pixels) to metres. The map's y axis becomes the 3D z axis; the camera looks north from the south.
const S = 1 / 40;
const at = (x, y) => [x * S, y * S];

// ================= Three.js set-up =================
const canvas = $('#gl');
const gl = new THREE.WebGLRenderer({ canvas, antialias: true });
gl.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
gl.shadowMap.enabled = true;
gl.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
scene.background = new THREE.Color('#A6DBFF');
scene.fog = new THREE.Fog('#A6DBFF', 40, 85);
const camera = new THREE.PerspectiveCamera(45, 1, .1, 200);
scene.add(new THREE.HemisphereLight('#ffffff', '#86b862', 1.5));
const sun = new THREE.DirectionalLight('#fff3dc', 2.3);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -24, right: 24, top: 24, bottom: -24, near: 1, far: 90 });
sun.shadow.bias = -.0006;
scene.add(sun, sun.target);

// ================= Small building blocks =================
const mats = {};
const mat = (c, flat = false) => mats[c + flat] || (mats[c + flat] = new THREE.MeshLambertMaterial({ color: c, flatShading: flat }));
function mesh(geo, c, x = 0, y = 0, z = 0, flat = false) {
  const m = new THREE.Mesh(geo, typeof c === 'string' ? mat(c, flat) : c);
  m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true;
  return m;
}
const box = (w, h, d, c, x, y, z) => mesh(new THREE.BoxGeometry(w, h, d), c, x, y, z);
const cyl = (rt, rb, h, c, x, y, z, seg = 16) => mesh(new THREE.CylinderGeometry(rt, rb, h, seg), c, x, y, z);
const sph = (r, c, x, y, z, seg = 16) => mesh(new THREE.SphereGeometry(r, seg, Math.max(8, seg * .75 | 0)), c, x, y, z);
const caps = (r, len, c, x, y, z) => mesh(new THREE.CapsuleGeometry(r, len, 6, 12), c, x, y, z);
const flatOn = m => { m.castShadow = false; return m; };
const group = (...kids) => { const g = new THREE.Group(); kids.forEach(k => k && g.add(k)); return g; };

// A canvas label (white rounded card) shown as a sprite that always faces the camera.
function label(text, { size = 1, color = '#2B2B3A', bg = '#ffffff' } = {}) {
  const c = document.createElement('canvas'), x = c.getContext('2d'), fs = 64;
  x.font = `700 ${fs}px Fredoka, "Comic Sans MS", sans-serif`;
  const w = Math.ceil(x.measureText(text).width) + fs * 1.1, h = Math.ceil(fs * 1.6);
  c.width = w; c.height = h;
  x.font = `700 ${fs}px Fredoka, "Comic Sans MS", sans-serif`;
  x.fillStyle = bg; x.strokeStyle = 'rgba(0,0,0,.15)'; x.lineWidth = 6;
  x.beginPath(); if (x.roundRect) x.roundRect(3, 3, w - 6, h - 6, h * .3); else x.rect(3, 3, w - 6, h - 6); x.fill(); x.stroke();
  x.fillStyle = color; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(text, w / 2, h / 2 + 3);
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 4;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthWrite: false }));
  sp.scale.set(w / h * .9 * size, .9 * size, 1);
  return sp;
}
function stripeTexture(a, b, n = 8, vertical = true) {
  const c = document.createElement('canvas'); c.width = 128; c.height = 128;
  const x = c.getContext('2d');
  for (let i = 0; i < n; i++) { x.fillStyle = i % 2 ? b : a; vertical ? x.fillRect(i * 128 / n, 0, 128 / n, 128) : x.fillRect(0, i * 128 / n, 128, 128 / n); }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}

// ================= Characters =================
const SKIN = '#F3C9A2';
// A person facing +z, feet at y = 0, about 2.7 m tall. userData holds the limbs for animation.
function makePerson(L, o = {}) {
  const g = new THREE.Group(), body = new THREE.Group(); g.add(body);
  const tc = L.topColor, bc = L.bottomColor, legC = L.bottom === 'broek' ? bc : SKIN, long = L.top === 'trui';
  if (o.board) {
    body.position.y = .22;
    g.add(box(.55, .08, 1.5, L.boardColor, 0, .14, 0));
    [[-.2, .55], [.2, .55], [-.2, -.55], [.2, -.55]].forEach(([x, z]) => { const w = cyl(.08, .08, .08, '#333', x, .07, z, 10); w.rotation.z = Math.PI / 2; g.add(w); });
  }
  const leg = side => {
    const piv = new THREE.Group(); piv.position.set(side * .19, .95, 0);
    piv.add(cyl(.11, .1, .85, legC, 0, -.45, 0));
    piv.add(L.shoes === 'laarzen' ? box(.26, .38, .34, L.shoeColor, 0, -.78, .02) : box(.26, .16, .4, L.shoeColor, 0, -.88, .06));
    body.add(piv); return piv;
  };
  const legL = leg(-1), legR = leg(1);
  if (L.bottom === 'rok') body.add(mesh(new THREE.CylinderGeometry(.3, .58, .55, 18, 1, true), new THREE.MeshLambertMaterial({ color: bc, side: THREE.DoubleSide }), 0, .92, 0));
  else body.add(cyl(.34, .34, L.bottom === 'kort' ? .42 : .3, bc, 0, L.bottom === 'kort' ? .98 : 1.06, 0));
  body.add(caps(.33, .42, tc, 0, 1.48, 0));
  if (L.top === 'streep') [1.38, 1.6].forEach(y => body.add(cyl(.345, .345, .08, tc === '#FFFFFF' ? '#5B7CFA' : '#FFFFFF', 0, y, 0, 18)));
  const arm = side => {
    const piv = new THREE.Group(); piv.position.set(side * .44, 1.78, 0);
    piv.add(caps(.095, .42, long ? tc : SKIN, 0, -.3, 0));
    if (!long) piv.add(sph(.14, tc, 0, -.05, 0, 12));
    piv.add(sph(.1, SKIN, 0, -.6, 0, 10));
    piv.rotation.z = side * .12;
    body.add(piv); return piv;
  };
  const armL = arm(-1), armR = arm(1);
  const head = new THREE.Group(); head.position.y = 2.25; body.add(head);
  head.add(sph(.46, SKIN, 0, 0, 0, 24));
  [-1, 1].forEach(s => {
    head.add(sph(.055, '#3B2A20', s * .16, .03, .42, 10));
    const ch = sph(.075, '#F49A9A', s * .28, -.1, .36, 10); ch.scale.z = .4; head.add(ch);
  });
  const smile = mesh(new THREE.TorusGeometry(.09, .022, 6, 14, Math.PI), '#3B2A20', 0, -.13, .43); smile.rotation.z = Math.PI; head.add(smile);
  addHair(head, L.hair, L.hairColor);
  addHat(head, L.hat, L.hatColor);
  g.userData = { body, legL, legR, armL, armR, head };
  return g;
}
function addHair(head, style, c) {
  const cap = mesh(new THREE.SphereGeometry(.485, 24, 14, 0, Math.PI * 2, 0, Math.PI * (style === 'kort' ? .42 : .5)), c);
  cap.rotation.x = -.35; head.add(cap);
  if (style === 'lang') { const b = box(.86, 1, .26, c, 0, -.42, -.3); head.add(b); }
  if (style === 'staartjes') [-1, 1].forEach(s => { const t = sph(.2, c, s * .52, -.12, -.08, 12); t.scale.set(1, 1.6, 1); head.add(t); head.add(sph(.07, '#FF6FA5', s * .45, .15, -.05, 8)); });
  if (style === 'paardenstaart') { const t = caps(.14, .5, c, 0, -.2, -.55); t.rotation.x = .5; head.add(t); }
  if (style === 'knot') head.add(sph(.22, c, 0, .5, -.12, 14));
  if (style === 'krullen') for (let i = 0; i < 9; i++) { const a = (i / 9) * Math.PI * 1.6 - Math.PI * .8 + Math.PI; head.add(sph(.18, c, Math.sin(a) * .45, .05 - Math.abs(Math.cos(a)) * .25, Math.cos(a) * .4, 10)); }
}
function addHat(head, hat, c) {
  if (hat === 'pet') { head.add(mesh(new THREE.SphereGeometry(.5, 20, 10, 0, Math.PI * 2, 0, Math.PI * .45), c, 0, .06, 0)); head.add(box(.5, .05, .42, c, 0, .26, .5)); }
  if (hat === 'muts') { head.add(mesh(new THREE.SphereGeometry(.52, 20, 10, 0, Math.PI * 2, 0, Math.PI * .5), c, 0, .08, 0)); head.add(cyl(.53, .53, .14, '#FFFFFF', 0, .1, 0, 20)); head.add(sph(.13, '#FFFFFF', 0, .62, 0, 10)); }
  if (hat === 'zonnehoed') { head.add(cyl(.9, .9, .05, c, 0, .32, 0, 24)); head.add(cyl(.42, .46, .34, c, 0, .5, 0, 20)); head.add(cyl(.465, .465, .08, '#FFFFFF', 0, .38, 0, 20)); }
  if (hat === 'kroon') { head.add(mesh(new THREE.CylinderGeometry(.32, .32, .22, 18, 1, true), new THREE.MeshLambertMaterial({ color: '#FFD23F', side: THREE.DoubleSide }), 0, .5, 0)); for (let i = 0; i < 6; i++) { const a = i / 6 * Math.PI * 2; head.add(mesh(new THREE.ConeGeometry(.07, .2, 6), '#FFD23F', Math.sin(a) * .3, .7, Math.cos(a) * .3)); } head.add(sph(.06, c, 0, .5, .32, 8)); }
  if (hat === 'strik') [-1, 1].forEach(s => { const k = mesh(new THREE.ConeGeometry(.14, .3, 8), c, .3 + s * .14, .42, 0); k.rotation.z = s * Math.PI / 2; head.add(k); });
}

// Misem the meerkat, about 1 m tall, facing +z.
function makeMisem() {
  const g = new THREE.Group(), body = new THREE.Group(); g.add(body);
  const b = sph(.25, '#D8B07A', 0, .48, 0); b.scale.set(1, 1.65, .9); body.add(b);
  const belly = sph(.17, '#F2DDB6', 0, .44, .13); belly.scale.set(1, 1.55, .6); body.add(belly);
  [-1, 1].forEach(s => {
    body.add(sph(.09, '#B88A55', s * .11, .06, .06, 10));
    const a = caps(.04, .16, '#B88A55', s * .1, .62, .2); a.rotation.x = .7; body.add(a);
    const patch = sph(.06, '#4A3524', s * .075, .97, .14, 10); patch.scale.set(1.2, .95, .5); body.add(patch);
    body.add(sph(.018, '#FFFFFF', s * .07, .985, .17, 6));
    body.add(sph(.045, '#4A3524', s * .15, 1.03, -.02, 8));
  });
  body.add(sph(.18, '#D8B07A', 0, .95, 0));
  const snout = mesh(new THREE.ConeGeometry(.085, .2, 12), '#ECCD9C', 0, .9, .2); snout.rotation.x = Math.PI / 2; body.add(snout);
  body.add(sph(.032, '#3A2A1A', 0, .9, .3, 8));
  const curve = new THREE.CatmullRomCurve3([new THREE.Vector3(0, .26, -.18), new THREE.Vector3(0, .1, -.45), new THREE.Vector3(0, .2, -.7), new THREE.Vector3(0, .42, -.82)]);
  body.add(mesh(new THREE.TubeGeometry(curve, 20, .035, 8), '#C99E66'));
  body.add(sph(.045, '#4A3524', 0, .42, -.82, 8));
  g.userData = { body };
  return g;
}

// A horse facing +z, feet at y = 0, about 3.1 m tall.
function makeHorse(o) {
  const g = new THREE.Group(), body = new THREE.Group(); g.add(body);
  const torso = caps(.56, 1.35, o.body, 0, 1.75, 0); torso.rotation.x = Math.PI / 2; body.add(torso);
  const legs = [];
  [[-.3, .65], [.3, .65], [-.3, -.65], [.3, -.65]].forEach(([x, z]) => {
    const piv = new THREE.Group(); piv.position.set(x, 1.45, z);
    piv.add(cyl(.13, .11, 1.3, o.body, 0, -.65, 0, 10)); piv.add(cyl(.13, .14, .16, '#3A2A1A', 0, -1.37, 0, 10));
    body.add(piv); legs.push(piv);
  });
  const neck = cyl(.24, .34, 1.15, o.body, 0, 2.45, .95); neck.rotation.x = .62; body.add(neck);
  const head = caps(.22, .55, o.body, 0, 2.95, 1.42); head.rotation.x = 1.15; body.add(head);
  [-1, 1].forEach(s => {
    body.add(sph(.05, '#2B1D14', s * .19, 3.08, 1.32, 8));
    const ear = mesh(new THREE.ConeGeometry(.07, o.longEars ? .5 : .22, 8), o.body, s * .11, o.longEars ? 3.5 : 3.33, 1.12); body.add(ear);
  });
  const mane = box(.12, .25, 1.15, o.mane, 0, 2.62, .78); mane.rotation.x = -.95; body.add(mane);
  const tail = caps(.12, .7, o.mane, 0, 1.6, -1.15); tail.rotation.x = .45; body.add(tail);
  if (o.blaze) { const bl = box(.08, .45, .05, '#FFFFFF', 0, 3.0, 1.62); bl.rotation.x = 1.15 - Math.PI / 2; body.add(bl); }
  if (o.stripes) for (let i = -2; i <= 2; i++) body.add(mesh(new THREE.TorusGeometry(.57, .05, 6, 20), '#222222', 0, 1.75, i * .32));
  if (o.spots) [[.4, 1.95, -.3], [-.45, 1.8, .2], [.38, 1.6, .4], [-.3, 2.05, -.5]].forEach(p => { const s = sph(.13, '#FFFFFF', ...p, 10); s.scale.x = .4; body.add(s); });
  if (o.saddle) { body.add(box(.95, .14, .8, o.saddle, 0, 2.33, -.05)); body.add(box(1.16, .08, .3, '#6B4A2A', 0, 1.95, -.05)); }
  g.userData = { body, legs };
  return g;
}
const DEFNE_HORSE = { body: '#9C5B2E', mane: '#3A2214', blaze: true, saddle: '#E0483D' };
const BABY_HORSE = { body: '#F2DDB6', mane: '#C79A5B', spots: true, saddle: '#FF6FA5' };

// ================= The city =================
const pickables = [];
function tagged(obj, tag) { obj.userData.tap = tag; pickables.push(obj); return obj; }

function tree(x, y, s = 1) {
  const [X, Z] = at(x, y), g = group();
  g.add(cyl(.18, .26, 1.4, '#8A5A2B', 0, .7, 0, 8));
  const c1 = mesh(new THREE.IcosahedronGeometry(1.2, 0), '#3E9A4A', 0, 2.2, 0, true); g.add(c1);
  const c2 = mesh(new THREE.IcosahedronGeometry(.8, 0), '#4CAF50', .55, 1.75, .3, true); g.add(c2);
  const c3 = mesh(new THREE.IcosahedronGeometry(.75, 0), '#4CAF50', -.5, 1.8, -.2, true); g.add(c3);
  g.position.set(X, 0, Z); g.scale.setScalar(s * 1.2); g.rotation.y = x * .37;
  return g;
}
function flowers(x, y, n = 5) {
  const g = group(), cols = ['#FF6FA5', '#FFD23F', '#FFFFFF', '#7C4DFF', '#FF9F1C'];
  for (let i = 0; i < n; i++) { const [X, Z] = at(x + i * 14, y + (i % 2) * 6); g.add(flatOn(cyl(.02, .02, .3, '#3E9A4A', X, .15, Z, 5))); g.add(flatOn(sph(.11, cols[i % 5], X, .33, Z, 8))); }
  return g;
}
function fence(z, color = '#FFFFFF', gaps = true) {
  const g = group(), [x0, z0] = at(z.x, z.y), [x1, z1] = at(z.x + z.w, z.y + z.h);
  const edge = (ax, az, bx, bz) => {
    const len = Math.hypot(bx - ax, bz - az), n = Math.round(len / 1.6);
    for (let i = 0; i <= n; i++) {
      const t = i / n, mid = Math.abs(t - .5) < .08 && gaps;
      if (mid) continue;
      g.add(box(.14, .9, .14, color, ax + (bx - ax) * t, .45, az + (bz - az) * t));
      if (i < n && !(gaps && Math.abs((i + .5) / n - .5) < .12)) {
        const r = box(len / n, .1, .08, color, ax + (bx - ax) * (t + .5 / n), .7, az + (bz - az) * (t + .5 / n));
        r.rotation.y = -Math.atan2(bz - az, bx - ax); g.add(r);
      }
    }
  };
  edge(x0, z0, x1, z0); edge(x1, z0, x1, z1); edge(x1, z1, x0, z1); edge(x0, z1, x0, z0);
  return g;
}

function building(p) {
  const [x0, z0] = at(p.x, p.y), w = p.w * S, d = p.h * S, cx = x0 + w / 2, cz = z0 + d / 2, front = z0 + d;
  const g = group();
  let top;
  if (p.type === 'house') {
    const hgt = 3.2; top = hgt + 2.6;
    g.add(box(w, hgt, d, p.wall, cx, hgt / 2, cz));
    const sh = new THREE.Shape(); sh.moveTo(-w / 2 - .4, 0); sh.lineTo(w / 2 + .4, 0); sh.lineTo(0, 2.4); sh.lineTo(-w / 2 - .4, 0);
    const roof = mesh(new THREE.ExtrudeGeometry(sh, { depth: d + .6, bevelEnabled: false }), p.roof, cx, hgt, z0 - .3); g.add(roof);
    g.add(box(.6, 1.6, .6, '#9A5B3C', x0 + w - 1.4, hgt + 1.6, cz));
    [x0 + 1.2, x0 + w - 1.2].forEach(x => { g.add(box(1.1, 1, .08, '#BFE6FF', x, 1.9, front + .04)); g.add(box(1.3, .12, .14, '#FFFFFF', x, 1.35, front + .06)); });
    g.add(flowers(p.x + 14, p.y + p.h + 10)); g.add(flowers(p.x + p.w - 78, p.y + p.h + 10));
  } else if (p.type === 'skate') {
    top = 2.4;
    g.add(flatOn(box(w, .06, d, '#C7CCD6', cx, .03, cz)));
    [[w, .9, .3, cx, z0 + .15], [.3, .9, d, x0 + .15, cz], [.3, .9, d, x0 + w - .15, cz]].forEach(([a, b, c, x, z]) => g.add(box(a, b, c, '#9AA2B1', x, b / 2, z)));
    g.add(box(w / 2 - 1, .9, .3, '#9AA2B1', x0 + w / 4 - .5, .45, front - .15)); g.add(box(w / 2 - 1, .9, .3, '#9AA2B1', x0 + w * .75 + .5, .45, front - .15));
    // two quarter pipes: a solid whose top curves up toward the wall
    const qp = new THREE.Shape(); qp.moveTo(0, 0); qp.lineTo(2.2, 0); qp.lineTo(2.2, 2); qp.quadraticCurveTo(2.2, 0, 0, 0);
    [-1, 1].forEach(s => {
      const q = mesh(new THREE.ExtrudeGeometry(qp, { depth: d - 1.2, bevelEnabled: false }), '#B9C0CC', s > 0 ? x0 + w - 2.5 : x0 + 2.5, 0, z0 + .6);
      q.scale.x = s; g.add(q);
    });
    const ramp = box(2.4, .8, 1.6, '#FF6FA5', cx, .3, cz); ramp.rotation.x = .25; g.add(ramp);
  } else {
    const hgt = p.type === 'zoo' ? 4.6 : 4.2; top = hgt + .5;
    g.add(box(w, hgt, d, p.wall, cx, hgt / 2, cz));

// Fewer draw calls: meshes that never move are merged per material (and per tappable group, so tapping still works).
function mergeStatic(root) {
  root.updateMatrixWorld(true);
  const buckets = new Map(), inv = new THREE.Matrix4(), m4 = new THREE.Matrix4();
  root.traverse(o => {
    if (!o.isMesh || Array.isArray(o.material) || o.material.map || o.userData.ground) return;
    let box = root;
    for (let a = o.parent; a; a = a.parent) { if (a.userData.keep) return; if (a.userData.tap && box === root) box = a; if (a === root) break; }
    const key = box.uuid + o.material.uuid + o.castShadow;
    if (!buckets.has(key)) buckets.set(key, { box, mat: o.material, cast: o.castShadow, list: [] });
    buckets.get(key).list.push(o);
  });
  buckets.forEach(({ box, mat, cast, list }) => {
    if (list.length < 2) return;
    inv.copy(box.matrixWorld).invert();
    const pos = [], nor = [];
    list.forEach(o => {
      const g = (o.geometry.index ? o.geometry.toNonIndexed() : o.geometry.clone());
      if (!g.attributes.normal) g.computeVertexNormals();
      g.applyMatrix4(m4.multiplyMatrices(inv, o.matrixWorld));
      pos.push(g.attributes.position.array); nor.push(g.attributes.normal.array);
      o.removeFromParent();
    });
    const join = arrs => { const out = new Float32Array(arrs.reduce((n, a) => n + a.length, 0)); let k = 0; arrs.forEach(a => { out.set(a, k); k += a.length; }); return out; };
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(join(pos), 3));
    geo.setAttribute('normal', new THREE.BufferAttribute(join(nor), 3));
    const merged = new THREE.Mesh(geo, mat); merged.castShadow = cast; merged.receiveShadow = true;
    box.add(merged);
  });
}

// Turn smoothly toward the way something walks; after standing still a moment, turn to face the camera.
function heading(root, x, z, dt, still) {
  const u = root.userData, dx = x - (u.px ?? x), dz = z - (u.pz ?? z);
  u.px = x; u.pz = z;
  if (Math.hypot(dx, dz) > .002) { u.want = Math.atan2(dx, dz); u.idle = 0; }
  else { u.idle = (u.idle || 0) + dt; if (u.idle > 1.2 && still) u.want = 0; }
  if (u.want === undefined) u.want = 0;
  let diff = u.want - root.rotation.y;
  diff = Math.atan2(Math.sin(diff), Math.cos(diff));
  root.rotation.y += diff * Math.min(1, dt * 10);
}

function animateFigure(fig, moving, t) {
  const u = fig.userData;
  if (u.kind === 'walk') {
    const a = moving ? Math.sin(t * 11) * .6 : 0;
    u.legL.rotation.x = a; u.legR.rotation.x = -a; u.armL.rotation.x = -a * .8; u.armR.rotation.x = a * .8;
    u.body.position.y = moving ? Math.abs(Math.sin(t * 11)) * .06 : 0;
  } else if (u.kind === 'board') {
    u.body.rotation.z = moving ? Math.sin(t * 3) * .06 : 0;
  } else if (u.kind === 'horse') {
    u.legs.forEach((l, i) => { l.rotation.x = moving ? Math.sin(t * 13 + (i % 2 ? 0 : Math.PI) + (i > 1 ? .8 : 0)) * .55 : 0; });
    u.body.position.y = moving ? Math.abs(Math.sin(t * 13)) * .12 : 0;
  } else if (u.kind === 'misem') {
    u.body.position.y = moving ? Math.abs(Math.sin(t * 16)) * .1 : 0;
    u.body.rotation.x = moving ? .12 : 0;
  }
}

  act = { id, t: 0, dur, clone, mk, done };

function stepActivity(dt) {
  if (!act) return;
  act.t += dt;
  const k = act.t / act.dur, t = act.t;
  if (act.id === 'schommel') PG.schommel.piv.rotation.x = Math.sin(t * Math.PI * 1.1) * .5 * Math.min(1, t, (act.dur - t) * 2);
  if (act.id === 'glijbaan') {
    const c = act.clone;
    if (k < .4) c.position.set(-1.4, (k / .4) * 2.5, -.5 + (k / .4) * .5);
    else { const s = (k - .4) / .6; c.position.set(-1.2 + s * 3.4, 2.5 - s * 2.3, 0); c.rotation.y = Math.PI / 2; c.userData.legL.rotation.x = c.userData.legR.rotation.x = -1.4; }
  }
  if (act.id === 'wip') PG.wip.piv.rotation.z = Math.sin(t * 4.5) * .22;
  if (act.id === 'draaimolen') PG.draaimolen.disk.rotation.y += dt * 3.2;
  if (act.id === 'zandbak') PG.zandbak.castle.scale.setScalar(Math.max(.001, Math.min(1, (t - .8) / 1.6)));
  if (act.t >= act.dur) {
    act.clone.removeFromParent(); if (act.mk) act.mk.removeFromParent();
    PG.schommel.piv.rotation.x = 0; PG.wip.piv.rotation.z = 0;
    playerRoot.visible = true; misemRoot.visible = true;
    const done = act.done; act = null; done();
  }
}

  gl.setSize(r.width, r.height, false);
  camera.aspect = r.width / r.height; camera.updateProjectionMatrix();
  zoom = camera.aspect < .8 ? 1.45 : camera.aspect < 1.2 ? 1.2 : 1;
}
function focusPoint() {
  if (act) { const p = PLAY[act.id]; return [p.x * S, p.y * S]; }
  return [P.x * S, P.y * S];
}
function updateCamera(dt, snap) {
  const [fx, fz] = focusPoint();
  const want = new THREE.Vector3(fx, 1.3, fz);
  look.lerp(want, snap ? 1 : Math.min(1, dt * 6));
  camPos.set(look.x, look.y + 11.5 * zoom, look.z + 12.5 * zoom);
  camera.position.lerp(camPos, snap ? 1 : Math.min(1, dt * 6));
  camera.lookAt(look);
  sun.position.set(look.x + 12, 26, look.z + 10); sun.target.position.copy(look);
}

const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0), hit = new THREE.Vector3();
canvas.addEventListener('pointerdown', ev => {
  if (Stad.inIntro() || Stad.inRoom()) return;
  const r = canvas.getBoundingClientRect();
  ndc.set((ev.clientX - r.left) / r.width * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hits = ray.intersectObjects(pickables, true);
  for (const h of hits) {
    let o = h.object; while (o && !o.userData.tap) o = o.parent;
    if (!o) continue;
    const t = o.userData.tap;
    if (t.place) return Stad.tap.place(t.place);
    if (t.play) return Stad.tap.play(t.play);
    if (t.horse) return Stad.tap.horse();
    if (t.npc) return Stad.tap.npc();
  }
  if (ray.ray.intersectPlane(groundPlane, hit)) Stad.tap.ground(hit.x / S, hit.z / S);
});

const movers = [];
let clock = performance.now(), T = 0;
// On a slow tablet: after the first seconds, drop shadows and render at normal pixel density.
const perf = { frames: 0, time: 0, done: false };
function adapt(dt) {
  if (perf.done) return;
  perf.frames++; perf.time += dt;
  if (perf.frames < 120) return;
  perf.done = true;
  if (perf.time / perf.frames > 1 / 28) {
    gl.setPixelRatio(1); resize();
    sun.castShadow = false; gl.shadowMap.enabled = false;
    scene.traverse(o => { if (o.material) [].concat(o.material).forEach(m => { m.needsUpdate = true; }); });
  }
}
function frame(now) {
  const dt = Math.min(.05, (now - clock) / 1000); clock = now; T += dt;
  if (!Stad.inRoom()) {
    if (!Stad.inIntro()) adapt(dt);
    stepActivity(dt);
    playerRoot.position.set(P.x * S, 0, P.y * S);
    misemRoot.position.set(M.x * S, 0, M.y * S);
    heading(playerRoot, playerRoot.position.x, playerRoot.position.z, dt, !riding());
    heading(misemRoot, misemRoot.position.x, misemRoot.position.z, dt, !riding());
    animateFigure(player, P.moving, T); animateFigure(misem, M.moving, T + .4);
    nisanG.userData.armR.rotation.z = .3 + Math.max(0, Math.sin(T * 2)) * 1.2; nisanG.userData.armR.rotation.x = -.2;
    movers.forEach(o => { if (o.userData.spin) o.rotation.y += dt * 2; else { o.position.x += Math.sin(T * .6) * dt * .5; o.rotation.y = Math.cos(T * .6) > 0 ? Math.PI / 2 : -Math.PI / 2; } });
    updateCamera(dt);
    gl.render(scene, camera);
    placeBubble();
  }
  requestAnimationFrame(frame);
}

// ================= Build and start =================
(async () => {
  try { await Promise.all([document.fonts.load('700 64px Fredoka'), document.fonts.load('700 20px Nunito')]); } catch (e) {}
  // In 3D the walk starts a little further into the city, so the welcome board stays in view behind Defne.
  P.y = 1390; M.y = 1400;
  const city = cityStatic(); mergeStatic(city); scene.add(city);
  scene.traverse(o => { if (o.userData.spin || o.userData.duck) movers.push(o); });
  const tag = (text, size, y) => { const l = label(text, { size }); l.position.y = y; return l; };
  horseG = tagged(makeHorse(DEFNE_HORSE), { horse: true }); horseG.rotation.y = -Math.PI / 2; horseG.add(tag("Defne's paard", .8, 4));
  babyG = tagged(makeHorse(BABY_HORSE), { horse: true }); babyG.scale.setScalar(.55); babyG.rotation.y = -Math.PI / 2; babyG.add(tag("Misem's veulen", 1.3, 5.2));
  nisanG = tagged(makePerson(NISAN_LOOK), { npc: true }); nisanG.position.set(nisanPos.x * S, 0, nisanPos.y * S);
  scene.add(horseG, babyG, nisanG);
  resize();
  Stad.boot({ drawPlayer, update() {}, resize, nisanSays, play });
  updateCamera(0, true);
  $('#loading').remove();
  window.stad3d = { gl, scene };  // handy for checking draw calls in the browser console
  requestAnimationFrame(frame);
})();
</script>
