<script type="module">
import * as THREE from './vendor/three.module.min.js';

const { $, state, P, M, horse, baby, PLACES, ZONES, PLAY, doorOf, nisanPos, NISAN_LOOK, SOUND, later, boardOn } = Stad;
const riding = () => Stad.riding();

// Map units (the 2D map's pixels) to metres. The map's y axis becomes the 3D z axis; the camera looks north from the south.
const S = 1 / 40;
const at = (x, y) => [x * S, y * S];

// ================= Three.js set-up =================
const canvas = $('#gl');
const gl = new THREE.WebGLRenderer({ canvas, antialias: true });
gl.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
gl.shadowMap.enabled = true;
gl.shadowMap.type = THREE.PCFSoftShadowMap;
gl.toneMapping = THREE.ACESFilmicToneMapping;
gl.toneMappingExposure = 1.05;
const scene = new THREE.Scene();
const HORIZON = '#D7ECFA', ZENITH = '#4E9BE0';
scene.fog = new THREE.Fog(HORIZON, 45, 110);
const camera = new THREE.PerspectiveCamera(45, 1, .1, 400);

// Sky: a big dome with a vertical gradient and a soft glow around the sun; it also lights the scene (environment map).
const SUN_DIR = new THREE.Vector3(12, 26, 10).normalize();
function skyDome(radius) {
  return new THREE.Mesh(new THREE.SphereGeometry(radius, 32, 16), new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: { top: { value: new THREE.Color(ZENITH) }, bottom: { value: new THREE.Color(HORIZON) }, sun: { value: SUN_DIR } },
    vertexShader: 'varying vec3 vDir; void main() { vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
    fragmentShader: 'uniform vec3 top; uniform vec3 bottom; uniform vec3 sun; varying vec3 vDir; void main() { float h = max(vDir.y, 0.0); vec3 c = mix(bottom, top, pow(h, 0.55)); float g = pow(max(dot(vDir, sun), 0.0), 64.0); c += vec3(1.0, 0.92, 0.75) * g * 0.8; if (vDir.y < 0.0) c = mix(bottom, vec3(0.55, 0.68, 0.45), min(1.0, -vDir.y * 4.0)); gl_FragColor = vec4(c, 1.0); }'
  }));
}
const sky = skyDome(300); scene.add(sky);
{
  const pmrem = new THREE.PMREMGenerator(gl), envScene = new THREE.Scene();
  envScene.add(skyDome(50));
  scene.environment = pmrem.fromScene(envScene, .02).texture;
}
scene.add(new THREE.HemisphereLight('#EAF4FF', '#6E8F4E', .45));
const sun = new THREE.DirectionalLight('#FFF0D4', 2.9);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -26, right: 26, top: 26, bottom: -26, near: 1, far: 100 });
sun.shadow.bias = -.0004; sun.shadow.normalBias = .02;
scene.add(sun, sun.target);

// ================= Materials and textures =================
const std = o => new THREE.MeshStandardMaterial(Object.assign({ roughness: .85, metalness: 0 }, o));
const mats = {};
const mat = (c, flat = false) => mats[c + flat] || (mats[c + flat] = std({ color: c, flatShading: flat }));
const GLASS = std({ color: '#8FB8D8', roughness: .08, metalness: .6, envMapIntensity: 1.4 });
const METAL = std({ color: '#3C434D', roughness: .45, metalness: .7 });
const SKIN_MAT = c => mats['skin' + c] || (mats['skin' + c] = std({ color: c, roughness: .6 }));
function mesh(geo, c, x = 0, y = 0, z = 0, flat = false) {
  const m = new THREE.Mesh(geo, typeof c === 'string' ? mat(c, flat) : c);
  m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true;
  return m;
}
const box = (w, h, d, c, x, y, z) => mesh(new THREE.BoxGeometry(w, h, d), c, x, y, z);
const cyl = (rt, rb, h, c, x, y, z, seg = 16) => mesh(new THREE.CylinderGeometry(rt, rb, h, seg), c, x, y, z);
const sph = (r, c, x, y, z, seg = 16) => mesh(new THREE.SphereGeometry(r, seg, Math.max(8, seg * .75 | 0)), c, x, y, z);
const caps = (r, len, c, x, y, z) => mesh(new THREE.CapsuleGeometry(r, len, 6, 12), c, x, y, z);
const flatOn = m => { m.castShadow = false; return m; };
const group = (...kids) => { const g = new THREE.Group(); kids.forEach(k => k && g.add(k)); return g; };

// Patterns are drawn light and neutral; a material's colour tints them (brick red, roof blue, ...).
let seed = 11;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const PATTERNS = {};
function pattern(name, draw, size = 256) {
  if (!PATTERNS[name]) {
    const c = document.createElement('canvas'); c.width = c.height = size;
    const x = c.getContext('2d'); draw(x, size);
    PATTERNS[name] = c;
  }
  const t = new THREE.CanvasTexture(PATTERNS[name]);
  t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = gl.capabilities.getMaxAnisotropy();
  return t;
}
function speckle(x, s, n, colors, r0, r1, alpha = .35) {
  for (let i = 0; i < n; i++) { x.globalAlpha = alpha * (.5 + rnd()); x.fillStyle = colors[i % colors.length]; x.beginPath(); x.arc(rnd() * s, rnd() * s, r0 + rnd() * (r1 - r0), 0, 7); x.fill(); }
  x.globalAlpha = 1;
}
const DRAW = {
  grass(x, s) {
    x.fillStyle = '#76AE4C'; x.fillRect(0, 0, s, s);
    speckle(x, s, 1400, ['#5C963A', '#8CC45E', '#6AA342', '#A2D46E', '#4E8532'], 1, 3.5);
    x.lineWidth = 1.2;
    for (let i = 0; i < 900; i++) { const X = rnd() * s, Y = rnd() * s; x.strokeStyle = rnd() < .5 ? '#4F8A33' : '#A6D873'; x.globalAlpha = .55; x.beginPath(); x.moveTo(X, Y); x.lineTo(X + (rnd() - .5) * 3, Y - 3 - rnd() * 5); x.stroke(); }
    x.globalAlpha = 1;
  },
  asphalt(x, s) { x.fillStyle = '#5A606B'; x.fillRect(0, 0, s, s); speckle(x, s, 2500, ['#4A4F58', '#6E7480', '#7D838E', '#3F444C'], .5, 1.8, .5); },
  paving(x, s) {
    x.fillStyle = '#D8D2C6'; x.fillRect(0, 0, s, s); speckle(x, s, 800, ['#C9C2B4', '#E6E1D7'], .5, 2);
    x.strokeStyle = '#B4AC9D'; x.lineWidth = 3; for (let i = 0; i <= 4; i++) { x.beginPath(); x.moveTo(i * s / 4, 0); x.lineTo(i * s / 4, s); x.moveTo(0, i * s / 4); x.lineTo(s, i * s / 4); x.stroke(); }
  },
  brick(x, s) {
    x.fillStyle = '#CFC6BA'; x.fillRect(0, 0, s, s);
    const rows = 16, h = s / rows, w = s / 4;
    for (let r = 0; r < rows; r++) for (let c = -1; c < 5; c++) { const l = 90 + rnd() * 10; x.fillStyle = `hsl(30, 12%, ${l}%)`; x.fillRect(c * w + (r % 2) * w / 2 + 2, r * h + 2, w - 4, h - 4); }
    speckle(x, s, 600, ['#BEB4A6', '#FFFFFF'], .5, 1.5, .25);
  },
  siding(x, s) {
    x.fillStyle = '#F4F1EC'; x.fillRect(0, 0, s, s);
    for (let i = 0; i < 10; i++) { const y = i * s / 10; const g = x.createLinearGradient(0, y, 0, y + s / 10); g.addColorStop(0, '#FFFFFF'); g.addColorStop(1, '#DDD7CD'); x.fillStyle = g; x.fillRect(0, y, s, s / 10 - 2); }
    speckle(x, s, 300, ['#E6E0D6'], .5, 1.5, .3);
  },
  plaster(x, s) { x.fillStyle = '#F1EEE9'; x.fillRect(0, 0, s, s); speckle(x, s, 1800, ['#E3DED6', '#FFFFFF', '#D9D3CA'], .5, 2.2, .35); },
  tiles(x, s) {
    x.fillStyle = '#D9D1C6'; x.fillRect(0, 0, s, s);
    const rows = 8, h = s / rows, w = s / 8;
    for (let r = 0; r < rows; r++) for (let c = -1; c < 9; c++) {
      const cx = c * w + (r % 2) * w / 2; x.fillStyle = `hsl(25, 10%, ${88 + rnd() * 10}%)`;
      x.beginPath(); x.moveTo(cx, r * h); x.lineTo(cx + w, r * h); x.lineTo(cx + w, r * h + h * .7); x.quadraticCurveTo(cx + w / 2, r * h + h * 1.15, cx, r * h + h * .7); x.closePath(); x.fill();
      x.strokeStyle = 'rgba(0,0,0,.18)'; x.lineWidth = 2; x.stroke();
    }
  },
  sand(x, s) { x.fillStyle = '#E8D3A0'; x.fillRect(0, 0, s, s); speckle(x, s, 2200, ['#D9C28A', '#F4E4BC', '#C9AF74'], .5, 1.6, .5); },
  concrete(x, s) { x.fillStyle = '#C8CCD2'; x.fillRect(0, 0, s, s); speckle(x, s, 1600, ['#B5BAC2', '#D9DCE1'], .5, 2.5, .4); x.strokeStyle = 'rgba(0,0,0,.12)'; x.lineWidth = 2; x.strokeRect(0, 0, s, s); },
  meadow(x, s) { DRAW.grass(x, s); x.fillStyle = 'rgba(255,255,220,.18)'; x.fillRect(0, 0, s, s); }
};
// A tinted, repeating surface material; repeat is in tiles per face.
function surface(name, color, rx = 1, ry = 1, extra = {}) {
  const t = pattern(name, DRAW[name]); t.repeat.set(rx, ry);
  return std(Object.assign({ color, map: t }, extra));
}

// A canvas label (white rounded card) shown as a sprite that always faces the camera.
function label(text, { size = 1, color = '#2B2B3A', bg = '#ffffff' } = {}) {
  const c = document.createElement('canvas'), x = c.getContext('2d'), fs = 64;
  x.font = `700 ${fs}px Fredoka, "Comic Sans MS", sans-serif`;
  const w = Math.ceil(x.measureText(text).width) + fs * 1.1, h = Math.ceil(fs * 1.6);
  c.width = w; c.height = h;
  x.font = `700 ${fs}px Fredoka, "Comic Sans MS", sans-serif`;
  x.fillStyle = bg; x.strokeStyle = 'rgba(0,0,0,.15)'; x.lineWidth = 6;
  x.beginPath(); if (x.roundRect) x.roundRect(3, 3, w - 6, h - 6, h * .3); else x.rect(3, 3, w - 6, h - 6); x.fill(); x.stroke();
  x.fillStyle = color; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(text, w / 2, h / 2 + 3);
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 4;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthWrite: false }));
  sp.scale.set(w / h * .9 * size, .9 * size, 1);
  return sp;
}
function stripeTexture(a, b, n = 8, vertical = true) {
  const c = document.createElement('canvas'); c.width = 128; c.height = 128;
  const x = c.getContext('2d');
  for (let i = 0; i < n; i++) { x.fillStyle = i % 2 ? b : a; vertical ? x.fillRect(i * 128 / n, 0, 128 / n, 128) : x.fillRect(0, i * 128 / n, 128, 128 / n); }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}

// ================= Characters =================
const SKIN = '#EDC3A0';
// A child facing +z, feet at y = 0, about 2.4 m in map scale, with natural proportions
// (the head is about a sixth of the height). userData holds the limbs for animation.
function makePerson(L, o = {}) {
  const g = new THREE.Group(), body = new THREE.Group(); g.add(body);
  const cloth = c => mats['cloth' + c] || (mats['cloth' + c] = std({ color: c, roughness: .92 }));
  const tc = cloth(L.topColor), bc = cloth(L.bottomColor), skin = SKIN_MAT(SKIN), legC = L.bottom === 'broek' ? bc : skin, long = L.top === 'trui';
  if (o.board) {
    body.position.y = .2;
    g.add(mesh(new THREE.CapsuleGeometry(.24, .95, 4, 12).rotateX(Math.PI / 2).scale(1, .22, 1), L.boardColor, 0, .14, 0));
    [[-.17, .5], [.17, .5], [-.17, -.5], [.17, -.5]].forEach(([x, z]) => { const w = cyl(.065, .065, .07, '#EEEEEE', x, .065, z, 12); w.rotation.z = Math.PI / 2; g.add(w); });
    [.5, -.5].forEach(z => g.add(box(.36, .03, .06, METAL, 0, .1, z)));
  }
  const leg = side => {
    const piv = new THREE.Group(); piv.position.set(side * .13, 1.0, 0);
    piv.add(mesh(new THREE.CylinderGeometry(.095, .07, .9, 12), legC, 0, -.46, 0));
    const shoeMat = mats['shoe' + L.shoeColor] || (mats['shoe' + L.shoeColor] = std({ color: L.shoeColor, roughness: .55 }));
    if (L.shoes === 'laarzen') piv.add(mesh(new THREE.CylinderGeometry(.1, .1, .42, 12), shoeMat, 0, -.73, 0));
    piv.add(mesh(new THREE.CapsuleGeometry(.075, .16, 4, 10).rotateX(Math.PI / 2), shoeMat, 0, -.93, .06));
    body.add(piv); return piv;
  };
  const legL = leg(-1), legR = leg(1);
  if (L.bottom === 'rok') body.add(mesh(new THREE.CylinderGeometry(.22, .4, .42, 20, 1, true), std({ color: L.bottomColor, roughness: .9, side: THREE.DoubleSide }), 0, .93, 0));
  else body.add(mesh(new THREE.CylinderGeometry(.235, .25, L.bottom === 'kort' ? .38 : .26, 16), bc, 0, L.bottom === 'kort' ? .97 : 1.04, 0));
  const torso = mesh(new THREE.CapsuleGeometry(.215, .36, 6, 16), tc, 0, 1.43, 0); torso.scale.z = .78; body.add(torso);
  if (L.top === 'streep') [1.36, 1.5, 1.64].forEach(y => { const r = mesh(new THREE.CylinderGeometry(.218, .218, .045, 18), L.topColor === '#FFFFFF' ? '#5B7CFA' : '#FFFFFF', 0, y, 0); r.scale.z = .78; body.add(r); });
  body.add(mesh(new THREE.TorusGeometry(.1, .025, 6, 16), tc, 0, 1.81, 0).rotateX(Math.PI / 2));
  const arm = side => {
    const piv = new THREE.Group(); piv.position.set(side * .27, 1.72, 0);
    piv.add(mesh(new THREE.CapsuleGeometry(.06, .5, 4, 10), long ? tc : skin, 0, -.33, 0));
    if (!long) piv.add(mesh(new THREE.CylinderGeometry(.085, .08, .2, 12), tc, 0, -.08, 0));
    piv.add(mesh(new THREE.SphereGeometry(.065, 12, 10), skin, 0, -.66, 0));
    piv.rotation.z = side * .1;
    body.add(piv); return piv;
  };
  const armL = arm(-1), armR = arm(1);
  body.add(mesh(new THREE.CylinderGeometry(.07, .08, .18, 12), skin, 0, 1.88, 0));
  // The head is modelled at radius .46 and scaled down, so the hair and hat shapes stay simple.
  const head = new THREE.Group(); head.position.y = 2.12; head.scale.setScalar(.6); body.add(head);
  const skull = mesh(new THREE.SphereGeometry(.46, 28, 20), skin); skull.scale.set(.94, 1.04, .98); head.add(skull);
  head.add(mesh(new THREE.SphereGeometry(.08, 10, 8), skin, 0, -.07, .45));
  const eyeW = mats.eyeW || (mats.eyeW = std({ color: '#FFFFFF', roughness: .3 })), iris = mats.iris || (mats.iris = std({ color: '#4A3020', roughness: .2 }));
  [-1, 1].forEach(s => {
    const w = mesh(new THREE.SphereGeometry(.075, 14, 10), eyeW, s * .16, .05, .38); w.scale.z = .55; head.add(w);
    head.add(mesh(new THREE.SphereGeometry(.045, 12, 8), iris, s * .16, .05, .42));
    head.add(mesh(new THREE.SphereGeometry(.014, 6, 6), '#FFFFFF', s * .16 + .015, .07, .46));
    const brow = box(.13, .025, .03, L.hairColor, s * .16, .17, .41); brow.rotation.z = -s * .12; head.add(brow);
    const ear = mesh(new THREE.SphereGeometry(.08, 10, 8), skin, s * .44, -.02, 0); ear.scale.x = .5; head.add(ear);
    const cheek = mesh(new THREE.SphereGeometry(.07, 10, 8), std({ color: '#F0A49A', roughness: .7, transparent: true, opacity: .45 }), s * .26, -.12, .37); cheek.scale.z = .3; head.add(cheek);
  });
  const smile = mesh(new THREE.TorusGeometry(.075, .016, 6, 14, Math.PI), '#9C4A3E', 0, -.2, .42); smile.rotation.z = Math.PI; head.add(smile);
  addHair(head, L.hair, L.hairColor);
  addHat(head, L.hat, L.hatColor);
  g.userData = { body, legL, legR, armL, armR, head };
  return g;
}
function hairMat(c) { return mats['hair' + c] || (mats['hair' + c] = std({ color: c, roughness: .5, metalness: .05 })); }
function addHair(head, style, c) {
  const m = hairMat(c);
  const cap = mesh(new THREE.SphereGeometry(.5, 28, 16, 0, Math.PI * 2, 0, Math.PI * (style === 'kort' ? .45 : .52)), m);
  cap.rotation.x = -.42; cap.position.y = .02; head.add(cap);
  const fringe = mesh(new THREE.SphereGeometry(.47, 20, 8, -1.1, 2.2, .35, .5), m, 0, .02, .04); head.add(fringe);
  if (style === 'lang') { const back = mesh(new THREE.CylinderGeometry(.46, .42, 1.15, 20, 1, true, Math.PI * .55, Math.PI * .9), std({ color: c, roughness: .5, side: THREE.DoubleSide }), 0, -.45, -.04); back.rotation.y = Math.PI; head.add(back); }
  if (style === 'staartjes') [-1, 1].forEach(s => { const t = mesh(new THREE.CapsuleGeometry(.13, .45, 4, 10), m, s * .55, -.3, -.12); t.rotation.z = s * .35; head.add(t); head.add(sph(.07, '#FF6FA5', s * .47, .02, -.1, 8)); });
  if (style === 'paardenstaart') { const t = mesh(new THREE.CapsuleGeometry(.13, .65, 4, 10), m, 0, -.35, -.55); t.rotation.x = .35; head.add(t); head.add(sph(.08, '#FF6FA5', 0, .05, -.48, 8)); }
  if (style === 'knot') head.add(mesh(new THREE.SphereGeometry(.24, 16, 12), m, 0, .5, -.18));
  if (style === 'krullen') for (let i = 0; i < 14; i++) { const a = (i / 14) * Math.PI * 2; head.add(mesh(new THREE.SphereGeometry(.17, 10, 8), m, Math.sin(a) * .44, .1 - (i % 2) * .22, Math.cos(a) * .4 - .06)); }
}
function addHat(head, hat, c) {
  const m = std({ color: c, roughness: .8 });
  if (hat === 'pet') { head.add(mesh(new THREE.SphereGeometry(.52, 20, 10, 0, Math.PI * 2, 0, Math.PI * .45), m, 0, .08, 0)); const brim = mesh(new THREE.CylinderGeometry(.3, .3, .04, 20, 1, false, -Math.PI / 2, Math.PI), m, 0, .3, .38); brim.rotation.x = .1; head.add(brim); }

// Things that turn see-through when they stand between the camera and Defne (trees, the welcome board).
const fadables = [];
function fadable(g) {
  g.userData.keep = true; g.userData.fade = 1; fadables.push(g);
  g.traverse(o => { if (o.isMesh) o.material = Array.isArray(o.material) ? o.material.map(m => m.clone()) : o.material.clone(); });
  return g;
}
const fadeRay = new THREE.Raycaster(), chest = new THREE.Vector3();
function fadeBlockers(dt) {
  const hitNow = new Set();
  // look from the camera to Defne's feet, middle and head: whatever is in the way fades
  [.3, 1.3, 2.3].forEach(h => {
    chest.set(P.x * S, h, P.y * S);
    const dir = chest.clone().sub(camera.position), dist = dir.length();
    fadeRay.set(camera.position, dir.normalize()); fadeRay.far = dist - .4;
    fadeRay.intersectObjects(fadables, true).forEach(hh => { let o = hh.object; while (o && !fadables.includes(o)) o = o.parent; if (o) hitNow.add(o); });
  });
  // the welcome board also fades while the camera stands behind it
  fadables.forEach(g => { if (g.userData.betweenZ && camera.position.z > g.userData.betweenZ && P.y * S < g.userData.betweenZ) hitNow.add(g); });
  fadables.forEach(g => {
    const want = hitNow.has(g) ? .28 : 1, f = g.userData.fade + (want - g.userData.fade) * Math.min(1, dt * 8);
    if (Math.abs(f - g.userData.fade) < .002 && (f === 1 || hitNow.has(g))) return;
    g.userData.fade = Math.abs(f - 1) < .01 ? 1 : f;
    const f1 = g.userData.fade;
    g.traverse(o => { if (o.isMesh) [].concat(o.material).forEach(m => { m.opacity = f1; m.transparent = f1 < 1; m.depthWrite = f1 >= 1; }); });
  });
}

function fence(z, color = '#FFFFFF', gaps = true) {

// Fewer draw calls: meshes that never move are merged per material (and per tappable group, so tapping still works).
function mergeStatic(root) {
  root.updateMatrixWorld(true);
  const buckets = new Map(), inv = new THREE.Matrix4(), m4 = new THREE.Matrix4();
  root.traverse(o => {
    if (!o.isMesh || o.isInstancedMesh || Array.isArray(o.material) || o.material.map || o.material.transparent || o.userData.ground) return;
    let box = root;
    for (let a = o.parent; a; a = a.parent) { if (a.userData.keep) return; if (a.userData.tap && box === root) box = a; if (a === root) break; }
    const key = box.uuid + o.material.uuid + o.castShadow;
    if (!buckets.has(key)) buckets.set(key, { box, mat: o.material, cast: o.castShadow, list: [] });
    buckets.get(key).list.push(o);
  });
  buckets.forEach(({ box, mat, cast, list }) => {
    if (list.length < 2) return;
    inv.copy(box.matrixWorld).invert();
    const pos = [], nor = [];
    list.forEach(o => {
      const g = (o.geometry.index ? o.geometry.toNonIndexed() : o.geometry.clone());
      if (!g.attributes.normal) g.computeVertexNormals();
      g.applyMatrix4(m4.multiplyMatrices(inv, o.matrixWorld));
      pos.push(g.attributes.position.array); nor.push(g.attributes.normal.array);
      o.removeFromParent();
    });
    const join = arrs => { const out = new Float32Array(arrs.reduce((n, a) => n + a.length, 0)); let k = 0; arrs.forEach(a => { out.set(a, k); k += a.length; }); return out; };
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(join(pos), 3));
    geo.setAttribute('normal', new THREE.BufferAttribute(join(nor), 3));
    const merged = new THREE.Mesh(geo, mat); merged.castShadow = cast; merged.receiveShadow = true;
    box.add(merged);
  });
}

// Turn smoothly toward the way something walks; after standing still a moment, turn to face the camera.
function heading(root, x, z, dt, still) {
  const u = root.userData, dx = x - (u.px ?? x), dz = z - (u.pz ?? z);
  u.px = x; u.pz = z;
  if (Math.hypot(dx, dz) > .002) { u.want = Math.atan2(dx, dz); u.idle = 0; }
  else { u.idle = (u.idle || 0) + dt; if (u.idle > 1.2 && still) u.want = 0; }
  if (u.want === undefined) u.want = 0;
  let diff = u.want - root.rotation.y;
  diff = Math.atan2(Math.sin(diff), Math.cos(diff));
  root.rotation.y += diff * Math.min(1, dt * 10);
}

  const u = fig.userData;
  if (u.kind === 'walk') {
    const a = moving ? Math.sin(t * 11) * .6 : 0;
    u.legL.rotation.x = a; u.legR.rotation.x = -a; u.armL.rotation.x = -a * .8; u.armR.rotation.x = a * .8;
    u.body.position.y = moving ? Math.abs(Math.sin(t * 11)) * .06 : 0;
  } else if (u.kind === 'board') {
    u.body.rotation.z = moving ? Math.sin(t * 3) * .06 : 0;
  } else if (u.kind === 'horse') {
    u.legs.forEach((l, i) => { l.rotation.x = moving ? Math.sin(t * 13 + (i % 2 ? 0 : Math.PI) + (i > 1 ? .8 : 0)) * .55 : 0; });
    u.body.position.y = moving ? Math.abs(Math.sin(t * 13)) * .12 : 0;
  } else if (u.kind === 'misem') {
    u.body.position.y = moving ? Math.abs(Math.sin(t * 16)) * .1 : 0;
    u.body.rotation.x = moving ? .12 : 0;
  }
}

// ================= Playground activities =================
let act = null;
function play(id, done) {
  const dur = id === 'glijbaan' ? 2.7 : 3.6, clone = makePerson(state.look), cu = clone.userData;
  playerRoot.visible = false;
  let mk = null;
  if (id === 'schommel') { PG.schommel.seat.add(clone); clone.position.set(0, -.55, -.05); cu.legL.rotation.x = cu.legR.rotation.x = -1.4; cu.armL.rotation.x = cu.armR.rotation.x = Math.PI; SOUND.whee(); }
  if (id === 'glijbaan') { PG.glijbaan.root.add(clone); later(1100, SOUND.whee); }
  if (id === 'wip') { PG.wip.left.add(clone); clone.position.y = -.88; clone.scale.setScalar(.8); cu.legL.rotation.x = cu.legR.rotation.x = -1.4; clone.rotation.y = Math.PI / 2;
    mk = makeMisem(); PG.wip.right.add(mk); mk.rotation.y = -Math.PI / 2; mk.scale.setScalar(1.3); misemRoot.visible = false; [0, 700, 1400, 2100, 2800].forEach(ms => later(ms, SOUND.pop)); }
  if (id === 'draaimolen') { PG.draaimolen.spot.add(clone); clone.scale.setScalar(.85); SOUND.whee(); }
  if (id === 'zandbak') { const [X, Z] = at(PLAY.zandbak.x - 40, PLAY.zandbak.y + 40); clone.position.set(X, 0, Z); scene.add(clone); later(2400, SOUND.yay); }
  act = { id, t: 0, dur, clone, mk, done };
}
function stepActivity(dt) {
  if (!act) return;
  act.t += dt;
  const k = act.t / act.dur, t = act.t;
  if (act.id === 'schommel') PG.schommel.piv.rotation.x = Math.sin(t * Math.PI * 1.1) * .5 * Math.min(1, t, (act.dur - t) * 2);
  if (act.id === 'glijbaan') {
    const c = act.clone;
    if (k < .4) c.position.set(-1.4, (k / .4) * 2.5, -.5 + (k / .4) * .5);
    else { const s = (k - .4) / .6; c.position.set(-1.2 + s * 3.4, 2.5 - s * 2.3, 0); c.rotation.y = Math.PI / 2; c.userData.legL.rotation.x = c.userData.legR.rotation.x = -1.4; }
  }
  if (act.id === 'wip') PG.wip.piv.rotation.z = Math.sin(t * 4.5) * .22;
  if (act.id === 'draaimolen') PG.draaimolen.disk.rotation.y += dt * 3.2;
  if (act.id === 'zandbak') PG.zandbak.castle.scale.setScalar(Math.max(.001, Math.min(1, (t - .8) / 1.6)));
  if (act.t >= act.dur) {
    act.clone.removeFromParent(); if (act.mk) act.mk.removeFromParent();
    PG.schommel.piv.rotation.x = 0; PG.wip.piv.rotation.z = 0;
    playerRoot.visible = true; misemRoot.visible = true;
    const done = act.done; act = null; done();
  }
}

// ================= Nisan's speech bubble (HTML, kept above her head) =================
let sayUntil = 0;
function nisanSays(text) {
  const b = $('#say3d'); b.textContent = text; b.hidden = false; sayUntil = performance.now() + 2600; SOUND.pop();
}
const headPos = new THREE.Vector3();
function placeBubble() {
  const b = $('#say3d');
  if (b.hidden) return;
  if (performance.now() > sayUntil || Stad.inRoom()) { b.hidden = true; return; }
  headPos.set(nisanPos.x * S, 3.3, nisanPos.y * S).project(camera);
  b.style.left = ((headPos.x + 1) / 2 * canvas.clientWidth) + 'px';
  b.style.top = ((1 - headPos.y) / 2 * canvas.clientHeight) + 'px';
}

// ================= Camera, picking, loop =================
let zoom = 1;
const look = new THREE.Vector3(), camPos = new THREE.Vector3();
function resize() {
  const r = $('#viewport').getBoundingClientRect();
  gl.setSize(r.width, r.height, false);
  camera.aspect = r.width / r.height; camera.updateProjectionMatrix();
  zoom = camera.aspect < .8 ? 1.35 : camera.aspect < 1.2 ? 1.15 : 1;
}
function focusPoint() {
  if (act) { const p = PLAY[act.id]; return [p.x * S, p.y * S]; }
  return [P.x * S, P.y * S];
}
function updateCamera(dt, snap) {
  const [fx, fz] = focusPoint();
  const want = new THREE.Vector3(fx, 1.5, fz);
  look.lerp(want, snap ? 1 : Math.min(1, dt * 6));
  camPos.set(look.x, look.y + 6.2 * zoom, look.z + 9.5 * zoom);
  camera.position.lerp(camPos, snap ? 1 : Math.min(1, dt * 6));
  camera.lookAt(look);
  sun.position.copy(look).addScaledVector(SUN_DIR, 40); sun.target.position.copy(look);
  sky.position.copy(camera.position);
}

const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0), hit = new THREE.Vector3();
canvas.addEventListener('pointerdown', ev => {
  if (Stad.inIntro() || Stad.inRoom()) return;
  const r = canvas.getBoundingClientRect();
  ndc.set((ev.clientX - r.left) / r.width * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hits = ray.intersectObjects(pickables, true);
  for (const h of hits) {
    let o = h.object; while (o && !o.userData.tap) o = o.parent;
    if (!o) continue;
    const t = o.userData.tap;
    if (t.place) return Stad.tap.place(t.place);
    if (t.play) return Stad.tap.play(t.play);
    if (t.horse) return Stad.tap.horse();
    if (t.npc) return Stad.tap.npc();
  }
  if (ray.ray.intersectPlane(groundPlane, hit)) Stad.tap.ground(hit.x / S, hit.z / S);
});

const movers = [];
let clock = performance.now(), T = 0;
// On a slow tablet: after the first seconds, drop shadows and render at normal pixel density.
const perf = { frames: 0, time: 0, done: false };
function adapt(dt) {
  if (perf.done) return;
  perf.frames++; perf.time += dt;
  if (perf.frames < 120) return;
  perf.done = true;
  if (perf.time / perf.frames > 1 / 28) {
    gl.setPixelRatio(1); resize();
    sun.castShadow = false; gl.shadowMap.enabled = false;
    scene.traverse(o => { if (o.material) [].concat(o.material).forEach(m => { m.needsUpdate = true; }); });
  }
}
function frame(now) {
  const dt = Math.min(.05, (now - clock) / 1000); clock = now; T += dt;
  if (!Stad.inRoom()) {
    if (!Stad.inIntro()) adapt(dt);
    stepActivity(dt);
    playerRoot.position.set(P.x * S, 0, P.y * S);
    misemRoot.position.set(M.x * S, 0, M.y * S);
    heading(playerRoot, playerRoot.position.x, playerRoot.position.z, dt, !riding());
    heading(misemRoot, misemRoot.position.x, misemRoot.position.z, dt, !riding());
    animateFigure(player, P.moving, T); animateFigure(misem, M.moving, T + .4);
    nisanG.userData.armR.rotation.z = .3 + Math.max(0, Math.sin(T * 2)) * 1.2; nisanG.userData.armR.rotation.x = -.2;
    movers.forEach(o => {
      if (o.userData.spin) o.rotation.y += dt * 2;
      else if (o.userData.cloud) { o.position.x += dt * .5; if (o.position.x > 110) o.position.x = -50; }
      else { o.position.x += Math.sin(T * .6) * dt * .5; o.rotation.y = Math.cos(T * .6) > 0 ? Math.PI / 2 : -Math.PI / 2; }
    });
    updateCamera(dt);
    fadeBlockers(dt);
    gl.render(scene, camera);
    placeBubble();
  }
  requestAnimationFrame(frame);
}

// ================= Build and start =================
(async () => {
  try { await Promise.all([document.fonts.load('700 64px Fredoka'), document.fonts.load('700 20px Nunito')]); } catch (e) {}
  // In 3D the walk starts a little further into the city, so the welcome board stays in view behind Defne.
  P.y = 1390; M.y = 1400;
  const city = cityStatic(); mergeStatic(city); scene.add(city);
  scene.traverse(o => { if (o.userData.spin || o.userData.duck || o.userData.cloud) movers.push(o); });
  const tag = (text, size, y) => { const l = label(text, { size }); l.position.y = y; return l; };
  horseG = tagged(makeHorse(DEFNE_HORSE), { horse: true }); horseG.rotation.y = -Math.PI / 2; horseG.add(tag("Defne's paard", .8, 4));
  babyG = tagged(makeHorse(BABY_HORSE), { horse: true }); babyG.scale.setScalar(.55); babyG.rotation.y = -Math.PI / 2; babyG.add(tag("Misem's veulen", 1.3, 5.2));
  nisanG = tagged(makePerson(NISAN_LOOK), { npc: true }); nisanG.position.set(nisanPos.x * S, 0, nisanPos.y * S);
  scene.add(horseG, babyG, nisanG);
  resize();
  Stad.boot({ drawPlayer, update() {}, resize, nisanSays, play });
  updateCamera(0, true);
  $('#loading').remove();
  window.stad3d = { gl, scene };  // handy for checking draw calls in the browser console
  requestAnimationFrame(frame);
})();
</script>
