<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Defne ve Nisan'ın Şehri</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="theme-color" content="#4FA3E0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Defne">
<script src="pwa.js" defer></script>
<link rel="stylesheet" href="stad.css">
</head>
<body>
<header class="top">
  <div class="brand"><a href="index.html" class="home" aria-label="Alle spelletjes">‹</a> Defne ve Nisan'ın Şehri</div>
  <div class="tools">
    <button class="icon-btn" id="boardBtn" hidden aria-pressed="false" aria-label="Skateboard aan of uit">🛹</button>
    <button class="icon-btn" id="soundBtn" aria-label="Geluid aan of uit">🔊</button>
  </div>
</header>

<main class="viewport" id="viewport">
  <svg id="city" aria-label="De stad"><g id="world"></g></svg>
  <div class="toast gone" id="toast" aria-live="polite"></div>
  <div class="hud" id="hud"></div>

  <section class="intro" id="intro">
    <div class="welcome">
      <div class="sign-board">
        <div class="deco" aria-hidden="true">🌸 ⭐ 🌸</div>
        <h1>Defne ve Nisan'ın Şehri</h1>
        <p>Welkom in de stad!</p>
      </div>
      <button class="start-btn" id="startBtn">Ga de stad in!</button>
      <p class="hint">Lopen: pijltjestoetsen, of tik waar je heen wilt.</p>
    </div>
  </section>

  <section class="room" id="room" hidden>
    <div class="room-head"><h2 id="roomTitle"></h2><button class="out-btn" id="outBtn">← Naar buiten</button></div>
    <div class="room-body" id="roomBody"></div>
  </section>
</main>

<script src="sommen.js"></script>
<script src="stad-kern.js"></script>
<script>
(() => {
  const { $, pick, clamp, later, state, SOUND, NISAN_LOOK, SKIN, personSVG, misemSVG, horseSVG, DEFNE_HORSE, BABY_HORSE,
    W, H, PLACES, ZONES, PLAY, doorOf, nisanPos, P, M, horse, baby, boardOn } = Stad;
  const riding = () => Stad.riding();

  function tree(x, y, s = 1) {
    return `<g transform="translate(${x} ${y}) scale(${s})"><ellipse cx="0" cy="0" rx="26" ry="7" fill="#000" opacity=".13"/><rect x="-6" y="-34" width="12" height="34" rx="4" fill="#8A5A2B"/>
      <circle cx="0" cy="-56" r="30" fill="#3E9A4A"/><circle cx="-16" cy="-44" r="18" fill="#4CAF50"/><circle cx="16" cy="-46" r="18" fill="#4CAF50"/><circle cx="-8" cy="-66" r="8" fill="#7DCB6A" opacity=".8"/></g>`;
  }
  function flowers(x, y) {
    const cols = ['#FF6FA5', '#FFD23F', '#FFFFFF', '#7C4DFF', '#FF9F1C'];
    return [0, 1, 2, 3, 4].map(i => `<g transform="translate(${x + i * 14} ${y + (i % 2) * 6})"><path d="M0 0 V-9" stroke="#3E9A4A" stroke-width="2"/><circle cx="0" cy="-11" r="4" fill="${cols[i]}"/><circle cx="0" cy="-11" r="1.5" fill="#FFD23F"/></g>`).join('');
  }
  function fence(z) {
    let s = `<rect x="${z.x}" y="${z.y}" width="${z.w}" height="${z.h}" rx="20" fill="none" stroke="#B5793F" stroke-width="5" stroke-dasharray="4 14" stroke-linecap="round"/>`;
    return s + `<rect x="${z.x}" y="${z.y}" width="${z.w}" height="${z.h}" rx="20" fill="none" stroke="#D9A066" stroke-width="3"/>`;
  }
  function signText(x, y, text, icon) {
    const w = Math.max(150, text.length * 13 + 50);
    return `<g><rect x="${x - w / 2}" y="${y - 22}" width="${w}" height="40" rx="12" fill="#fff" stroke="#2B2B3A" stroke-opacity=".15" stroke-width="2"/>
      <text x="${x}" y="${y + 6}" text-anchor="middle" font-size="22" font-weight="700" fill="#2B2B3A">${icon} ${text}</text></g>`;
  }

  function buildingSVG(p) {
    const { x, y, w, h, wall, roof } = p, cx = x + w / 2, door = doorOf(p);
    let s = `<g class="bld" data-place="${p.id}"><rect x="${x + 8}" y="${y + h - 8}" width="${w}" height="18" rx="8" fill="#000" opacity=".12"/>`;
    if (p.type === 'house') {
      s += `<rect x="${x + w - 70}" y="${y - 40}" width="26" height="50" fill="#9A5B3C"/>`;
      s += `<path d="M${x - 16} ${y + 50} L${cx} ${y - 60} L${x + w + 16} ${y + 50} Z" fill="${roof}"/>`;
      s += `<rect x="${x}" y="${y + 44}" width="${w}" height="${h - 44}" rx="6" fill="${wall}"/>`;
      s += `<rect x="${x + 22}" y="${y + 70}" width="50" height="44" rx="6" fill="#BFE6FF" stroke="#fff" stroke-width="5"/><rect x="${x + w - 72}" y="${y + 70}" width="50" height="44" rx="6" fill="#BFE6FF" stroke="#fff" stroke-width="5"/>`;
      s += flowers(x + 18, y + h - 4) + flowers(x + w - 80, y + h - 4);
      s += `<circle cx="${cx}" cy="${y + 10}" r="18" fill="#FFF8EE"/><text x="${cx}" y="${y + 18}" text-anchor="middle" font-size="22">${p.icon}</text>`;
    } else if (p.type === 'skate') {
      s += `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="18" fill="${wall}"/>`;
      s += `<path d="M${x + 10} ${y + 20} Q${x + 10} ${y + h - 30} ${x + 90} ${y + h - 30} H${x + w - 90} Q${x + w - 10} ${y + h - 30} ${x + w - 10} ${y + 20}" fill="none" stroke="#9AA2B1" stroke-width="16" stroke-linecap="round"/>`;
      s += `<path d="M${x + 120} ${y + 70} q30 -26 60 0 q30 26 60 0" stroke="#FF6FA5" stroke-width="7" fill="none"/><path d="M${x + 150} ${y + 110} l25 -22 l25 22 l25 -22" stroke="#2EC4B6" stroke-width="7" fill="none"/>`;
      s += `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="18" fill="none" stroke="#6E7685" stroke-width="5" stroke-dasharray="3 10"/>`;
    } else {
      s += `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="10" fill="${wall}"/>`;
      s += `<rect x="${x - 10}" y="${y - 18}" width="${w + 20}" height="30" rx="10" fill="${roof}"/>`;
      const wins = Math.max(2, Math.floor(w / 110));
      for (let i = 0; i < wins; i++) {
        const wx = x + 24 + i * ((w - 48 - 54) / Math.max(1, wins - 1));
        if (Math.abs(wx + 27 - cx) < 50) continue;
        s += `<rect x="${wx}" y="${y + 50}" width="54" height="56" rx="8" fill="#BFE6FF" stroke="#fff" stroke-width="5"/>`;
      }
      if (p.type === 'shop') {
        for (let i = 0; i < w / 40; i++) s += `<path d="M${x + i * 40} ${y + 12} h40 v22 q-10 10 -20 0 q-10 10 -20 0 Z" fill="${i % 2 ? '#fff' : roof}"/>`;
        s += `<text x="${x + 40}" y="${y + h - 14}" font-size="26">🍎🥕</text><text x="${x + w - 104}" y="${y + h - 14}" font-size="26">🍌🍞</text>`;
      }
      if (p.id === 'bieb') for (let i = 0; i < 4; i++) s += `<rect x="${x + 30 + i * 90}" y="${y + 120}" width="16" height="${h - 120}" fill="#fff" opacity=".85"/>`;
      if (p.id === 'kapper') s += `<rect x="${x + w - 40}" y="${y + 90}" width="18" height="70" rx="9" fill="#fff"/><path d="M${x + w - 40} ${y + 100} l18 -10 M${x + w - 40} ${y + 122} l18 -10 M${x + w - 40} ${y + 144} l18 -10" stroke="#E0483D" stroke-width="6"/>`;
      if (p.type === 'zoo') {
        s += `<path d="M${cx - 90} ${y + h} V${y + 80} Q${cx} ${y - 10} ${cx + 90} ${y + 80} V${y + h}" fill="none" stroke="#2E7A38" stroke-width="18"/>`;
        s += `<text x="${x + 50}" y="${y + h - 30}" font-size="40">🦒</text><text x="${x + w - 100}" y="${y + h - 30}" font-size="40">🐘</text>`;
      }
    }
    s += `<rect x="${cx - 23}" y="${y + h - 64}" width="46" height="64" rx="8" fill="${p.type === 'skate' ? '#6E7685' : '#8A5A3B'}"/><circle cx="${cx + 12}" cy="${y + h - 32}" r="3.5" fill="#FFD23F"/>`;
    if (p.type === 'skate') s += `<rect x="${cx - 23}" y="${y + h - 64}" width="46" height="64" fill="none" stroke="#DDE3EE" stroke-width="3" stroke-dasharray="6 5"/>`;
    s += signText(cx, p.type === 'house' ? y + 60 : y + 6, p.name, p.icon);
    s += `<ellipse cx="${door.x}" cy="${door.y}" rx="34" ry="9" fill="#FFF" opacity=".35"/>`;
    return s + '</g>';
  }

  function playgroundSVG() {
    const z = ZONES.speeltuin, P = PLAY;
    let s = `<rect x="${z.x}" y="${z.y}" width="${z.w}" height="${z.h}" rx="20" fill="#F3D9A4"/>` + fence(z);
    s += signText(z.x + z.w / 2, z.y - 6, z.name, '🛝');
    // swing
    s += `<g class="tap" data-play="schommel"><path d="M${P.schommel.x - 60} ${P.schommel.y + 10} L${P.schommel.x - 40} ${P.schommel.y - 110} H${P.schommel.x + 40} L${P.schommel.x + 60} ${P.schommel.y + 10}" fill="none" stroke="#E0483D" stroke-width="8" stroke-linejoin="round"/>
      <g id="swingSeat" style="transform-origin:${P.schommel.x}px ${P.schommel.y - 110}px"><path d="M${P.schommel.x - 14} ${P.schommel.y - 110} V${P.schommel.y - 30} M${P.schommel.x + 14} ${P.schommel.y - 110} V${P.schommel.y - 30}" stroke="#555" stroke-width="2.5"/>
      <rect x="${P.schommel.x - 20}" y="${P.schommel.y - 32}" width="40" height="8" rx="3" fill="#FFD23F"/><g class="rider"></g></g></g>`;
    // slide
    const sx = P.glijbaan.x, sy = P.glijbaan.y;
    s += `<g class="tap" data-play="glijbaan"><path d="M${sx - 60} ${sy} V${sy - 110} M${sx - 34} ${sy} V${sy - 110}" stroke="#5B7CFA" stroke-width="6"/>
      ${[0, 1, 2, 3, 4].map(i => `<path d="M${sx - 60} ${sy - 20 - i * 20} H${sx - 34}" stroke="#5B7CFA" stroke-width="4"/>`).join('')}
      <path d="M${sx - 40} ${sy - 112} Q${sx + 20} ${sy - 100} ${sx + 70} ${sy - 6}" stroke="#FF9F1C" stroke-width="16" fill="none" stroke-linecap="round"/>
      <rect x="${sx - 66}" y="${sy - 120}" width="38" height="10" rx="4" fill="#5B7CFA"/><g class="rider"></g></g>`;
    // seesaw
    const wx = P.wip.x, wy = P.wip.y;
    s += `<g class="tap" data-play="wip"><path d="M${wx - 16} ${wy} L${wx} ${wy - 32} L${wx + 16} ${wy} Z" fill="#7C4DFF"/>
      <g id="seesaw" style="transform-origin:${wx}px ${wy - 32}px"><rect x="${wx - 100}" y="${wy - 38}" width="200" height="10" rx="5" fill="#2EC4B6"/><g class="rider"></g></g></g>`;
    // merry-go-round
    const mx = P.draaimolen.x, my = P.draaimolen.y;
    s += `<g class="tap" data-play="draaimolen"><ellipse cx="${mx}" cy="${my}" rx="60" ry="22" fill="#E0483D"/>
      <g id="merry" style="transform-origin:${mx}px ${my}px">${[0, 1, 2, 3].map(i => `<path d="M${mx} ${my} L${mx + Math.cos(i * Math.PI / 2) * 56} ${my + Math.sin(i * Math.PI / 2) * 20}" stroke="#FFD23F" stroke-width="6"/>`).join('')}</g>
      <rect x="${mx - 4}" y="${my - 40}" width="8" height="40" fill="#FFD23F"/><g class="rider"></g></g>`;
    // sandbox
    const bx = P.zandbak.x, by = P.zandbak.y;
    s += `<g class="tap" data-play="zandbak"><rect x="${bx - 80}" y="${by - 40}" width="160" height="70" rx="10" fill="#F7E2A8" stroke="#B5793F" stroke-width="7"/>
      <text x="${bx - 50}" y="${by + 12}" font-size="26">🪣</text><g id="castle" opacity="0"><text x="${bx + 2}" y="${by + 16}" font-size="40">🏰</text></g><g class="rider"></g></g>`;
    return s;
  }

  function manegeSVG() {
    const z = ZONES.manege;
    let s = `<rect x="${z.x}" y="${z.y}" width="${z.w}" height="${z.h}" rx="20" fill="#C9E9A0"/>`;
    for (let i = 0; i < 6; i++) s += `<path d="M${z.x + 60 + i * 140} ${z.y + 60 + (i % 3) * 110} q8 -10 16 0" stroke="#7DBB57" stroke-width="3" fill="none"/>`;
    s += `<rect x="${z.x}" y="${z.y}" width="${z.w}" height="${z.h}" rx="20" fill="none" stroke="#FFFFFF" stroke-width="10"/><rect x="${z.x}" y="${z.y}" width="${z.w}" height="${z.h}" rx="20" fill="none" stroke="#B5793F" stroke-width="3" stroke-dasharray="2 38"/>`;
    s += signText(z.x + z.w / 2, z.y - 6, z.name, '🐴');
    s += `<g transform="translate(${z.x + z.w - 150} ${z.y + 70})"><rect x="0" y="0" width="120" height="80" rx="6" fill="#B5502E"/><path d="M-10 4 L60 -40 L130 4 Z" fill="#7A3018"/><rect x="40" y="30" width="40" height="50" fill="#5E2A14"/><path d="M40 30 L80 80 M80 30 L40 80" stroke="#E9C99B" stroke-width="4"/></g>`;
    s += `<g transform="translate(${z.x + 60} ${z.y + 300})"><rect x="0" y="0" width="70" height="24" rx="6" fill="#9DD7F5" stroke="#6B4A2A" stroke-width="4"/><text x="80" y="20" font-size="22">🌾</text></g>`;
    return s;
  }

  function cityStatic() {
    let s = `<rect width="${W}" height="${H}" fill="#9BD770"/>`;
    for (let i = 0; i < 70; i++) s += `<circle cx="${(i * 337) % W}" cy="${(i * 211) % H}" r="${3 + (i % 3)}" fill="#8BCB62"/>`;
    // roads
    s += `<rect x="0" y="740" width="${W}" height="120" fill="#E9E1D3"/><rect x="0" y="755" width="${W}" height="90" fill="#8C97A6"/>`;
    s += `<rect x="1140" y="0" width="120" height="${H}" fill="#E9E1D3"/><rect x="1155" y="0" width="90" height="${H}" fill="#8C97A6"/>`;
    s += `<path d="M0 800 H${W}" stroke="#fff" stroke-width="5" stroke-dasharray="34 26"/><path d="M1200 0 V${H}" stroke="#fff" stroke-width="5" stroke-dasharray="34 26"/>`;
    s += `<rect x="1155" y="755" width="90" height="90" fill="#8C97A6"/>`;
    for (let i = 0; i < 6; i++) s += `<rect x="${1160 + i * 15}" y="${700}" width="9" height="40" fill="#fff"/><rect x="${1160 + i * 15}" y="${862}" width="9" height="40" fill="#fff"/>`;
    // fountain at the crossing corner
    s += `<g transform="translate(1000 680)"><ellipse rx="60" ry="22" fill="#B9C3D1"/><ellipse rx="50" ry="17" fill="#7FC8F8"/><rect x="-6" y="-46" width="12" height="40" fill="#B9C3D1"/><path d="M0 -46 q-26 -6 -34 30 M0 -46 q26 -6 34 30" stroke="#BFE6FF" stroke-width="5" fill="none"/></g>`;
    // trees & flowers
    [[80, 260], [520, 300], [900, 280], [1000, 520], [1320, 240], [1900, 260], [2330, 300], [2330, 640], [60, 700], [880, 700],
     [1050, 1180], [1080, 1450], [1330, 1180], [1880, 1130], [2050, 1000], [2330, 1000], [2340, 1200], [60, 1700], [1080, 1690]].forEach(([x, y], i) => { s += tree(x, y, .85 + (i % 3) * .12); });
    s += flowers(1700, 1180) + flowers(540, 690) + flowers(1860, 690) + flowers(2120, 680);
    // pond near the market
    s += `<ellipse cx="2130" cy="1080" rx="120" ry="50" fill="#7FC8F8" stroke="#5DB2E8" stroke-width="5"/><text x="2080" y="1095" font-size="30">🦆</text>`;
    s += playgroundSVG() + manegeSVG();
    PLACES.forEach(p => { s += buildingSVG(p); });
    // the big welcome board over the entrance road
    s += `<g transform="translate(1200 1650)"><rect x="-150" y="-110" width="16" height="120" fill="#8A5A2B"/><rect x="134" y="-110" width="16" height="120" fill="#8A5A2B"/>
      <rect x="-200" y="-180" width="400" height="90" rx="20" fill="#FFE38A" stroke="#B5793F" stroke-width="8"/>
      <text x="0" y="-126" text-anchor="middle" font-size="31" font-weight="700" fill="#D94C84">Defne ve Nisan'ın Şehri</text>
      <text x="-176" y="-150" font-size="22">🌸</text><text x="150" y="-150" font-size="22">⭐</text></g>`;
    return s;
  }

  const world = $('#world');
  world.innerHTML = cityStatic() + `<g id="npc"></g><g id="horseG"></g><g id="babyG"></g><g id="misemG"><g id="misemFlip"></g></g><g id="playerG"><g id="playerFlip"></g></g>`;

  // Nisan stands by her house and says hello.
  $('#npc').innerHTML = `<g transform="translate(${nisanPos.x} ${nisanPos.y})" class="tap" data-npc="nisan">${personSVG(NISAN_LOOK)}<g id="nisanBubble"></g></g>`;

  function drawPlayer() {
    let s;
    if (riding()) {
      const leg = state.look.bottom === 'broek' ? state.look.bottomColor : SKIN;
      s = `<g class="gallop">${horseSVG(DEFNE_HORSE)}
        <clipPath id="riderClip"><rect x="-60" y="-140" width="120" height="104"/></clipPath>
        <g transform="translate(-2 -46) scale(.85)"><g clip-path="url(#riderClip)">${personSVG(state.look, { noShadow: true })}</g>
          <rect x="-5" y="-40" width="9" height="30" rx="4" fill="${leg}" transform="rotate(-12 0 -40)"/><ellipse cx="-4" cy="-10" rx="7" ry="4.5" fill="${state.look.shoeColor}" stroke="rgba(0,0,0,.25)"/></g></g>`;
    }
    else s = personSVG(state.look, { board: boardOn() });
    $('#playerFlip').innerHTML = s;
    const babyRide = riding() ? `<g class="gallop">${horseSVG(BABY_HORSE)}<g transform="translate(-2 -76)">${misemSVG()}</g></g>` : '';
    $('#misemFlip').innerHTML = riding() ? `<g transform="scale(.55)">${babyRide}</g>` : `<g class="mk">${misemSVG()}</g>`;
    $('#horseG').innerHTML = riding() ? '' : `<g transform="translate(${horse.x} ${horse.y})" class="tap" data-horse="1">${horseSVG(DEFNE_HORSE)}<text x="0" y="24" text-anchor="middle" font-size="16" font-weight="700" fill="#5E3A1A">Defne's paard</text></g>`;
    $('#babyG').innerHTML = riding() ? '' : `<g transform="translate(${baby.x} ${baby.y}) scale(.5)" class="tap" data-horse="1">${horseSVG(BABY_HORSE)}<text x="0" y="44" text-anchor="middle" font-size="28" font-weight="700" fill="#5E3A1A">Misem's veulen</text></g>`;
    $('#boardBtn').hidden = state.look.board === 'geen';
    $('#boardBtn').setAttribute('aria-pressed', String(boardOn()));
  }
  let scale = 1, cam = { x: 0, y: 0 }, vw = 0, vh = 0;
  function measure() {
    const r = $('#viewport').getBoundingClientRect();
    vw = r.width; vh = r.height;
    scale = vw < 700 ? .72 : vw < 1100 ? .9 : 1;
  }
  function camera() {
    cam.x = clamp(P.x - vw / scale / 2, 0, Math.max(0, W - vw / scale));
    cam.y = clamp(P.y - 60 - vh / scale / 2, 0, Math.max(0, H - vh / scale));
    world.setAttribute('transform', `scale(${scale}) translate(${-cam.x} ${-cam.y})`);
  }

  function render() {
    $('#playerG').setAttribute('transform', `translate(${P.x.toFixed(1)} ${P.y.toFixed(1)})`);
    $('#playerFlip').setAttribute('transform', `scale(${P.face} 1)`);
    $('#playerFlip').classList.toggle('walking', P.moving && !boardOn() && !riding());
    $('#misemG').setAttribute('transform', `translate(${M.x.toFixed(1)} ${M.y.toFixed(1)})`);
    $('#misemFlip').setAttribute('transform', `scale(${M.face} 1)`);
    const mk = $('#misemFlip .mk'); if (mk) mk.classList.toggle('bob', M.moving);
    // Who is in front: the one lower on the map.
    const pg = $('#playerG'), mg = $('#misemG');
    if ((M.y > P.y) !== (mg.nextSibling === null)) world.appendChild(M.y > P.y ? mg : pg);
    camera();
  }

  function nisanSays(text) {
    const w = text.length * 9 + 30;
    $('#nisanBubble').innerHTML = `<g class="bubble"><rect x="${-w / 2}" y="-160" width="${w}" height="40" rx="14" fill="#fff" stroke="#2B2B3A" stroke-opacity=".2" stroke-width="2"/><path d="M-6 -121 L0 -110 L6 -121 Z" fill="#fff"/><text x="0" y="-133" text-anchor="middle" font-size="17" font-weight="700" fill="#2B2B3A">${text}</text></g>`;
    SOUND.pop();
    setTimeout(() => { $('#nisanBubble').innerHTML = ''; }, 2600);
  }

  // ================= Playground activities =================
  function play(id, done) {
    const g = document.querySelector(`[data-play="${id}"]`), rider = g.querySelector('.rider'), p = PLAY[id];
    $('#playerG').style.display = 'none';
    const me = personSVG(state.look, { noShadow: true }), mk = misemSVG();
    let ms = 3600;
    if (id === 'schommel') {
      rider.innerHTML = `<g transform="translate(${p.x} ${p.y - 26}) scale(.9)">${me}</g>`;
      $('#swingSeat').animate([{ transform: 'rotate(-28deg)' }, { transform: 'rotate(28deg)' }], { duration: 900, iterations: 4, direction: 'alternate', easing: 'ease-in-out' });
      SOUND.whee();
    } else if (id === 'glijbaan') {
      rider.innerHTML = `<g transform="translate(${p.x - 47} ${p.y - 112})"><g class="sl">${me}</g></g>`;
      rider.querySelector('.sl').animate([
        { transform: 'translate(0, 112px)' }, { transform: 'translate(0, 0)', offset: .4 },
        { transform: 'translate(60px, 30px)', offset: .7 }, { transform: 'translate(112px, 106px)' }], { duration: 2600, easing: 'ease-in' });
      later(1100, SOUND.whee); ms = 2700;
    } else if (id === 'wip') {
      rider.innerHTML = `<g transform="translate(${p.x - 80} ${p.y - 38}) scale(.8)">${me}</g><g transform="translate(${p.x + 84} ${p.y - 38}) scale(1.3)">${mk}</g>`;
      $('#seesaw').animate([{ transform: 'rotate(-12deg)' }, { transform: 'rotate(12deg)' }], { duration: 700, iterations: 5, direction: 'alternate', easing: 'ease-in-out' });
      [0, 700, 1400, 2100, 2800].forEach(t => later(t, SOUND.pop));
    } else if (id === 'draaimolen') {
      rider.innerHTML = `<g transform="translate(${p.x} ${p.y - 6})"><g class="spin">${me}</g></g>`;
      $('#merry').animate([{ transform: 'scaleX(1)' }, { transform: 'scaleX(-1)' }, { transform: 'scaleX(1)' }], { duration: 700, iterations: 5 });
      rider.querySelector('.spin').animate([{ transform: 'scaleX(1)' }, { transform: 'scaleX(-1)' }, { transform: 'scaleX(1)' }], { duration: 700, iterations: 5 });
      SOUND.whee();
    } else {
      rider.innerHTML = `<g transform="translate(${p.x - 30} ${p.y + 20}) scale(.9)">${me}</g>`;
      $('#castle').animate([{ opacity: 0, transform: 'translateY(20px)' }, { opacity: 1, transform: 'none' }], { duration: 1600, delay: 800, fill: 'forwards' });
      later(2400, SOUND.yay);
    }
    $('#misemG').style.display = id === 'wip' ? 'none' : '';
    setTimeout(() => {
      rider.innerHTML = '';
      $('#playerG').style.display = ''; $('#misemG').style.display = '';
      done();
    }, ms);
  }

  // ================= Input on the map =================
  function worldPoint(ev) {
    const r = $('#viewport').getBoundingClientRect();
    return { x: cam.x + (ev.clientX - r.left) / scale, y: cam.y + (ev.clientY - r.top) / scale };
  }
  $('#city').addEventListener('pointerdown', ev => {
    const t = ev.target.closest('[data-place],[data-play],[data-horse],[data-npc]');
    if (t && t.dataset.place) return Stad.tap.place(t.dataset.place);
    if (t && t.dataset.play) return Stad.tap.play(t.dataset.play);
    if (t && t.dataset.horse) return Stad.tap.horse();
    if (t && t.dataset.npc) return Stad.tap.npc();
    const pt = worldPoint(ev);
    Stad.tap.ground(pt.x, pt.y);
  });
  Stad.boot({ drawPlayer, update: render, resize() { measure(); camera(); }, nisanSays, play });
})();
</script>
</body>
</html>
