<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Defne ve Nisan'ın Şehri</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="theme-color" content="#4FA3E0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Defne">
<script src="pwa.js" defer></script>
<style>
/* Layout: a bird's-eye city map that fills the screen under a slim header; places open as full-screen rooms on top of the map. */
:root {
  --sky: #4FA3E0;
  --grass: #9BD770;
  --ink: #2B2B3A;
  --muted: #646A80;
  --card: #FFFFFF;
  --line: #DDE3EE;
  --pink: #FF6FA5;
  --pink-dark: #D94C84;
  --sun: #FFD23F;
  --good: #2E9E5B;
  --display: "Fredoka", "Baloo 2", "Comic Sans MS", system-ui, sans-serif;
  --body: "Nunito", "Segoe UI", system-ui, sans-serif;
  /* answer pad (sommen.js) */
  --q-ink: var(--ink); --q-muted: var(--muted); --q-soft: #F1F5FB; --q-card: #fff; --q-line: var(--line); --q-faint: #BCC4D6;
  --q-accent: #6A4CE0; --q-good: var(--good); --q-good-dark: #1F7442; --q-good-soft: #E1F5E9; --q-bad: #E0483D; --q-display: var(--display);
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; font-family: var(--body); color: var(--ink); background: var(--sky);
  display: flex; flex-direction: column; overflow: hidden;
  -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible { outline: 4px solid var(--sun); outline-offset: 2px; }

.top {
  flex: none; display: flex; align-items: center; justify-content: space-between; gap: 10px;
  background: var(--card); box-shadow: 0 3px 0 rgba(0,0,0,.12); z-index: 5;
  padding: 8px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px));
}
.brand { font-family: var(--display); font-weight: 700; font-size: 1.4rem; color: var(--pink-dark); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.home { color: inherit; text-decoration: none; padding-right: 2px; }
.tools { display: flex; gap: 8px; flex: none; }
.icon-btn { border: 0; background: #F1F5FB; border-radius: 999px; min-width: 44px; height: 44px; padding: 0 10px; font-size: 1.25rem; font-family: var(--display); font-weight: 600; }
.icon-btn[aria-pressed="true"] { background: #FFE3EE; box-shadow: inset 0 0 0 3px var(--pink); }

/* ---- City ---- */
.viewport { position: relative; flex: 1; overflow: hidden; touch-action: none; background: var(--grass); }
#city { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#city text { font-family: var(--display); }
.bld, .tap { cursor: pointer; }
.walking .lg.l { animation: step .36s ease-in-out infinite alternate; }
.walking .lg.r { animation: step .36s ease-in-out infinite alternate-reverse; }
@keyframes step { from { transform: translateY(0); } to { transform: translateY(-4px); } }
.bob { animation: bob .3s ease-in-out infinite alternate; }
@keyframes bob { to { transform: translateY(-2.5px); } }
.gallop { animation: gallop .32s ease-in-out infinite alternate; }
@keyframes gallop { to { transform: translateY(-5px) rotate(-2deg); } }

.hud { position: absolute; left: 0; right: 0; bottom: 0; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; pointer-events: none;
  padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.hud > * { pointer-events: auto; }
.act {
  border: 0; border-radius: 18px; padding: 13px 22px; font-family: var(--display); font-weight: 700; font-size: 1.3rem;
  background: var(--pink); color: #fff; box-shadow: 0 5px 0 var(--pink-dark), 0 10px 20px rgba(0,0,0,.18);
  animation: pulse 1.4s ease-in-out infinite;
}
.act.green { background: var(--good); box-shadow: 0 5px 0 #1F7442, 0 10px 20px rgba(0,0,0,.18); }
@keyframes pulse { 50% { transform: scale(1.05); } }
.toast {
  position: absolute; top: 14px; left: 50%; transform: translateX(-50%); max-width: calc(100% - 32px);
  background: rgba(255,255,255,.95); border-radius: 16px; padding: 8px 16px; font-family: var(--display); font-weight: 600; font-size: 1.1rem;
  box-shadow: 0 4px 0 rgba(0,0,0,.1); pointer-events: none; text-align: center; transition: opacity .3s;
}
.toast.gone { opacity: 0; }

/* ---- Welcome ---- */
.intro { position: absolute; inset: 0; z-index: 20; display: grid; place-items: center; padding: 16px; background: linear-gradient(#7CC4F2, #BFE6FF 60%, var(--grass) 60%); }
.welcome { width: min(100%, 640px); text-align: center; display: flex; flex-direction: column; align-items: center; gap: 18px; }
.sign-board { position: relative; width: 100%; padding: 28px 18px 30px; border-radius: 26px; background: linear-gradient(#FFF4C7, #FFE38A); border: 8px solid #B5793F; box-shadow: 0 10px 0 #8A5A2B, 0 24px 40px rgba(0,0,0,.25); }
.sign-board::before, .sign-board::after { content: ""; position: absolute; top: 100%; width: 22px; height: 120px; background: #8A5A2B; z-index: -1; }
.sign-board::before { left: 18%; } .sign-board::after { right: 18%; }
.sign-board h1 { margin: 0; font-family: var(--display); font-weight: 700; font-size: clamp(2rem, 8vw, 3.4rem); color: var(--pink-dark); text-wrap: balance; line-height: 1.1; }
.sign-board p { margin: 10px 0 0; font-weight: 800; color: #8A5A2B; font-size: 1.1rem; }
.sign-board .deco { font-size: 1.8rem; letter-spacing: 6px; }
.start-btn { margin-top: 70px; border: 0; border-radius: 20px; padding: 16px 30px; font-family: var(--display); font-weight: 700; font-size: 1.5rem; background: var(--pink); color: #fff; box-shadow: 0 6px 0 var(--pink-dark); }
.hint { font-weight: 800; color: #2E6B2E; margin: 0; background: rgba(255,255,255,.7); padding: 6px 14px; border-radius: 12px; }

/* ---- Rooms ---- */
.room { position: absolute; inset: 0; z-index: 10; background: #FFF8EE; display: flex; flex-direction: column; overflow: hidden; }
.room-head { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); background: rgba(255,255,255,.85); box-shadow: 0 2px 0 rgba(0,0,0,.08); }
.room-head h2 { margin: 0; font-family: var(--display); font-size: 1.5rem; color: var(--pink-dark); }
.out-btn { border: 0; border-radius: 14px; padding: 10px 16px; font-family: var(--display); font-weight: 700; font-size: 1.05rem; background: var(--good); color: #fff; box-shadow: 0 4px 0 #1F7442; white-space: nowrap; }
.room-body { flex: 1; overflow: auto; padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.wrap { max-width: 980px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.lead { margin: 0; font-size: 1.12rem; line-height: 1.45; }
.panel { background: var(--card); border-radius: 22px; padding: 16px; box-shadow: 0 5px 0 var(--line); display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); gap: 16px; align-items: start; }
@media (max-width: 760px) { .split { grid-template-columns: minmax(0, 1fr); } }
.scene { width: 100%; height: auto; display: block; border-radius: 18px; }
.scene text { font-family: var(--display); }
.preview { width: min(100%, 220px); margin: 0 auto; display: block; }
.mirror { background: radial-gradient(circle at 50% 40%, #FFFFFF, #DDEBFA); border: 10px solid #E9B949; border-radius: 50% 50% 40% 40%; padding: 10px; }
.label { font-family: var(--display); font-weight: 700; font-size: 1.1rem; margin: 0; }
.choices { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 3px solid var(--line); background: #fff; border-radius: 14px; padding: 8px 12px; font-family: var(--display); font-weight: 600; font-size: 1.05rem; }
.chip[aria-pressed="true"] { border-color: var(--pink); background: #FFE9F1; color: var(--pink-dark); }
.sw { width: 40px; height: 40px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 0 2px var(--line); padding: 0; }
.sw[aria-pressed="true"] { box-shadow: 0 0 0 4px var(--pink); }
.tabs { display: flex; gap: 8px; flex-wrap: wrap; }
.tab { border: 0; border-radius: 14px; padding: 10px 14px; font-family: var(--display); font-weight: 700; font-size: 1.05rem; background: #F1F5FB; }
.tab[aria-selected="true"] { background: var(--pink); color: #fff; }
.big { border: 0; border-radius: 18px; padding: 14px 22px; font-family: var(--display); font-weight: 700; font-size: 1.3rem; background: var(--pink); color: #fff; box-shadow: 0 5px 0 var(--pink-dark); }
.big:disabled { background: #CDD3E0; box-shadow: 0 5px 0 #AEB6C8; cursor: default; }
.big.green { background: var(--good); box-shadow: 0 5px 0 #1F7442; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: center; }

.books { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; padding: 14px; border-radius: 16px; background: #B57A45; box-shadow: inset 0 -10px 0 #8E5A2E; }
.book { border: 0; aspect-ratio: 3 / 4; border-radius: 6px 12px 12px 6px; padding: 10px 8px; color: #fff; font-family: var(--display); font-weight: 700; font-size: 1rem; text-align: center; display: flex; flex-direction: column; justify-content: space-between; align-items: center; box-shadow: inset 6px 0 0 rgba(0,0,0,.18), 0 4px 0 rgba(0,0,0,.2); text-wrap: balance; }
.book .ico { font-size: 2.6rem; }
.reader { position: absolute; inset: 0; z-index: 3; background: rgba(43, 43, 58, .55); display: grid; place-items: center; padding: 16px; }
.page { width: min(100%, 560px); background: #FFFDF6; border-radius: 22px; padding: 22px; display: flex; flex-direction: column; gap: 14px; align-items: center; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,.3); }
.page .pic { font-size: 5rem; line-height: 1.1; }
.page h3 { margin: 0; font-family: var(--display); font-size: 1.5rem; color: var(--pink-dark); }
.page p { margin: 0; font-size: 1.35rem; line-height: 1.5; text-wrap: balance; }
.page small { color: var(--muted); font-weight: 800; }

.shop { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; }
.item { border: 3px solid var(--line); background: #fff; border-radius: 16px; padding: 10px 6px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-family: var(--display); font-weight: 600; }
.item .ico { font-size: 2.4rem; }
.item .price { background: var(--sun); border-radius: 999px; padding: 1px 10px; font-weight: 700; }
.basket { min-height: 64px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 2.2rem; padding: 8px 12px; border-radius: 16px; background: #F1F5FB; }
.basket .empty { font-size: 1rem; font-weight: 800; color: var(--muted); }
.basket button { border: 0; background: none; font-size: 2.2rem; padding: 0 2px; }

.zoo-animal { cursor: pointer; }
.zoo-animal.hop > g { animation: hop .6s cubic-bezier(.3, 1.6, .5, 1); transform-box: fill-box; transform-origin: bottom; }
@keyframes hop { 40% { transform: translateY(-26px) scale(1.05); } }
.bubble { animation: popin .25s ease-out both; }
@keyframes popin { from { opacity: 0; transform: scale(.4); } to { opacity: 1; transform: none; } }
.bubble { transform-box: fill-box; transform-origin: bottom center; }

.skate-wrap { position: relative; }
.pump { display: flex; justify-content: space-between; gap: 10px; }
.pump .big { flex: 1; font-size: 1.8rem; touch-action: none; }
.score { font-family: var(--display); font-weight: 700; font-size: 1.3rem; text-align: center; }
.trick-msg { position: absolute; left: 50%; top: 18%; transform: translateX(-50%); font-family: var(--display); font-weight: 700; font-size: 2rem; color: var(--pink-dark); text-shadow: 0 3px 0 #fff; pointer-events: none; animation: rise 1.1s ease-out forwards; white-space: nowrap; }
@keyframes rise { from { opacity: 1; transform: translate(-50%, 10px); } to { opacity: 0; transform: translate(-50%, -40px); } }

.toy { cursor: pointer; }
.toy.wiggle { animation: wiggle .5s; transform-box: fill-box; transform-origin: center; }
@keyframes wiggle { 25% { transform: rotate(-8deg) scale(1.08); } 75% { transform: rotate(8deg) scale(1.08); } }
.night { transition: opacity .8s; }

@media (max-width: 700px) {
  .brand { font-size: 1.1rem; } .icon-btn { min-width: 40px; height: 40px; font-size: 1.1rem; }
  .act { font-size: 1.1rem; padding: 11px 16px; }
  .room-head h2 { font-size: 1.2rem; }
  .page p { font-size: 1.15rem; } .page .pic { font-size: 3.8rem; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><a href="index.html" class="home" aria-label="Alle spelletjes">‹</a> Defne ve Nisan'ın Şehri</div>
  <div class="tools">
    <button class="icon-btn" id="boardBtn" hidden aria-pressed="false" aria-label="Skateboard aan of uit">🛹</button>
    <button class="icon-btn" id="soundBtn" aria-label="Geluid aan of uit">🔊</button>
  </div>
</header>

<main class="viewport" id="viewport">
  <svg id="city" aria-label="De stad"><g id="world"></g></svg>
  <div class="toast gone" id="toast" aria-live="polite"></div>
  <div class="hud" id="hud"></div>

  <section class="intro" id="intro">
    <div class="welcome">
      <div class="sign-board">
        <div class="deco" aria-hidden="true">🌸 ⭐ 🌸</div>
        <h1>Defne ve Nisan'ın Şehri</h1>
        <p>Welkom in de stad!</p>
      </div>
      <button class="start-btn" id="startBtn">Ga de stad in!</button>
      <p class="hint">Lopen: pijltjestoetsen, of tik waar je heen wilt.</p>
    </div>
  </section>

  <section class="room" id="room" hidden>
    <div class="room-head"><h2 id="roomTitle"></h2><button class="out-btn" id="outBtn">← Naar buiten</button></div>
    <div class="room-body" id="roomBody"></div>
  </section>
</main>

<script src="sommen.js"></script>
<script>
(() => {
  const $ = s => document.querySelector(s);
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const store = {
    get(k, d) { try { const v = localStorage.getItem('stad-' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('stad-' + k, JSON.stringify(v)); } catch (e) {} }
  };

  // ================= Look of the character =================
  const DEFAULT_LOOK = {
    hair: 'lang', hairColor: '#6B3E26', top: 'tshirt', topColor: '#FF6FA5', bottom: 'rok', bottomColor: '#5B7CFA',
    shoes: 'sneaker', shoeColor: '#FFFFFF', hat: 'geen', hatColor: '#FFD23F', board: 'geen', boardColor: '#7C4DFF'
  };
  const NISAN_LOOK = {
    hair: 'krullen', hairColor: '#2B1D14', top: 'streep', topColor: '#2EC4B6', bottom: 'broek', bottomColor: '#FFB703',
    shoes: 'sneaker', shoeColor: '#E0483D', hat: 'strik', hatColor: '#FF6FA5', board: 'geen', boardColor: '#7C4DFF'
  };
  const state = {
    look: Object.assign({}, DEFAULT_LOOK, store.get('look', {})),
    onBoard: store.get('onBoard', false),
    fridge: store.get('fridge', []),
    skateBest: store.get('skateBest', 0)
  };
  Sommen.soundOn = store.get('sound', true);

  const SKIN = '#F3C9A2', CHEEK = '#F49A9A', INK = '#3B2A20';
  const FRINGE = c => `<path d="M-17.5 -81 Q-18 -99 0 -99 Q18 -99 17.5 -81 Q12 -91 3 -88 Q-6 -93 -17.5 -81 Z" fill="${c}"/>`;
  const HAIR = {
    kort: { name: 'Kort', back: () => '', front: c => `<path d="M-17.5 -79 Q-19 -100 0 -100 Q19 -100 17.5 -79 Q16 -88 9 -91 Q0 -86 -9 -91 Q-16 -88 -17.5 -79 Z" fill="${c}"/>` },
    lang: { name: 'Lang', back: c => `<path d="M-18 -84 Q-22 -60 -17 -48 Q0 -44 17 -48 Q22 -60 18 -84 Z" fill="${c}"/>`, front: FRINGE },
    staartjes: { name: 'Staartjes', back: c => `<ellipse cx="-22" cy="-74" rx="6" ry="12" fill="${c}" transform="rotate(22 -22 -74)"/><ellipse cx="22" cy="-74" rx="6" ry="12" fill="${c}" transform="rotate(-22 22 -74)"/>`,
      front: c => FRINGE(c) + `<circle cx="-17" cy="-84" r="3" fill="#FF6FA5"/><circle cx="17" cy="-84" r="3" fill="#FF6FA5"/>` },
    paardenstaart: { name: 'Paardenstaart', back: c => `<path d="M10 -94 Q32 -88 26 -58 Q20 -64 13 -80 Z" fill="${c}"/>`, front: FRINGE },
    knot: { name: 'Knot', back: () => '', front: c => `<circle cx="0" cy="-102" r="8.5" fill="${c}"/>` + FRINGE(c) },
    krullen: { name: 'Krullen', back: c => `<circle cx="-18" cy="-72" r="6.5" fill="${c}"/><circle cx="18" cy="-72" r="6.5" fill="${c}"/><circle cx="-16" cy="-62" r="5.5" fill="${c}"/><circle cx="16" cy="-62" r="5.5" fill="${c}"/>`,
      front: c => [-14, -7, 0, 7, 14].map(x => `<circle cx="${x}" cy="${-93 + Math.abs(x) / 2.5}" r="7.5" fill="${c}"/>`).join('') }
  };
  const HATS = {
    geen: { name: 'Geen', draw: () => '' },
    pet: { name: 'Pet', draw: c => `<path d="M-18 -88 Q-18 -105 0 -105 Q18 -105 18 -88 Z" fill="${c}"/><path d="M4 -89 Q22 -93 27 -86 Q14 -84 4 -86 Z" fill="${c}" stroke="rgba(0,0,0,.2)"/>` },
    muts: { name: 'Muts', draw: c => `<path d="M-18 -86 Q-18 -108 0 -108 Q18 -108 18 -86 Z" fill="${c}"/><rect x="-19" y="-90" width="38" height="7" rx="3" fill="#fff" opacity=".75"/><circle cx="0" cy="-110" r="5" fill="#fff"/>` },
    zonnehoed: { name: 'Zonnehoed', draw: c => `<ellipse cx="0" cy="-90" rx="28" ry="6" fill="${c}"/><path d="M-14 -90 Q-14 -107 0 -107 Q14 -107 14 -90 Z" fill="${c}"/><rect x="-14" y="-95" width="28" height="4" fill="#fff" opacity=".75"/>` },
    kroon: { name: 'Kroon', draw: c => `<path d="M-13 -95 L-13 -109 L-6.5 -101 L0 -111 L6.5 -101 L13 -109 L13 -95 Z" fill="#FFD23F" stroke="#D9A400"/><circle cx="0" cy="-99" r="2.4" fill="${c}"/>` },
    strik: { name: 'Strik', draw: c => `<path d="M9 -95 l10 -7 v14 Z M9 -95 l-10 -7 v14 Z" fill="${c}"/><circle cx="9" cy="-95" r="3" fill="${c}"/>` }
  };
  const TOPS = { tshirt: 'T-shirt', trui: 'Trui', streep: 'Streepjes' };
  const BOTTOMS = { rok: 'Rok', broek: 'Broek', kort: 'Korte broek' };
  const SHOES = { sneaker: 'Sneakers', laarzen: 'Laarzen' };
  const CLOTH_COLORS = ['#FF6FA5', '#E0483D', '#FF9F1C', '#FFD23F', '#2E9E5B', '#2EC4B6', '#5B7CFA', '#7C4DFF', '#FFFFFF', '#2B2B3A'];
  const HAIR_COLORS = ['#2B1D14', '#6B3E26', '#A0612F', '#E8C26A', '#D9542B', '#FF8CC6', '#5BA4FF', '#9B6BFF'];

  function boardSVG(c) {
    return `<rect x="-25" y="-8" width="50" height="6" rx="3" fill="${c}" stroke="rgba(0,0,0,.25)"/><circle cx="-15" cy="-1" r="3.2" fill="#333"/><circle cx="15" cy="-1" r="3.2" fill="#333"/>`;
  }

  // A front-facing person; the feet are at (0, 0) and the head top near y = -100.
  function personSVG(L, o = {}) {
    const tc = L.topColor, bc = L.bottomColor, sc = L.shoeColor, legFill = L.bottom === 'broek' ? bc : SKIN;
    const lift = o.board ? 8 : 0, long = L.top === 'trui';
    const shoe = x => L.shoes === 'laarzen'
      ? `<rect x="${x - 5}" y="-17" width="11" height="16" rx="3" fill="${sc}" stroke="rgba(0,0,0,.2)"/>`
      : `<ellipse cx="${x + 1}" cy="-3" rx="6.5" ry="4" fill="${sc}" stroke="rgba(0,0,0,.25)"/>`;
    let s = o.noShadow ? '' : `<ellipse cx="0" cy="0" rx="17" ry="4.5" fill="#000" opacity=".18"/>`;
    if (o.board) s += boardSVG(L.boardColor);
    s += `<g transform="translate(0 ${-lift})">`;
    s += (HAIR[L.hair] || HAIR.lang).back(L.hairColor);
    s += `<g class="lg l"><rect x="-9" y="-35" width="7" height="32" rx="3" fill="${legFill}"/>${shoe(-6)}</g>`;
    s += `<g class="lg r"><rect x="2" y="-35" width="7" height="32" rx="3" fill="${legFill}"/>${shoe(5)}</g>`;
    if (L.bottom === 'rok') s += `<path d="M-13 -45 H13 L19 -25 Q0 -21 -19 -25 Z" fill="${bc}"/>`;
    else if (L.bottom === 'kort') s += `<path d="M-13 -45 H13 V-28 H2 V-36 H-2 V-28 H-13 Z" fill="${bc}"/>`;

  let ac;
  function sweep(points, type = 'sine', vol = .2) {
    if (!Sommen.soundOn) return;
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      const o = ac.createOscillator(), g = ac.createGain(), t0 = ac.currentTime, end = points[points.length - 1][0];
      o.type = type;
      points.forEach(([t, f], i) => i ? o.frequency.linearRampToValueAtTime(f, t0 + t) : o.frequency.setValueAtTime(f, t0));
      g.gain.setValueAtTime(.0001, t0);
      g.gain.exponentialRampToValueAtTime(vol, t0 + .03);
      g.gain.setValueAtTime(vol, t0 + Math.max(.04, end - .06));
      g.gain.exponentialRampToValueAtTime(.0001, t0 + end);
      o.connect(g).connect(ac.destination);
      o.start(t0); o.stop(t0 + end + .05);
    } catch (e) {}
  }

  function manegeSVG() {

  function cityStatic() {

    // roads
    s += `<rect x="0" y="740" width="${W}" height="120" fill="#E9E1D3"/><rect x="0" y="755" width="${W}" height="90" fill="#8C97A6"/>`;
    s += `<rect x="1140" y="0" width="120" height="${H}" fill="#E9E1D3"/><rect x="1155" y="0" width="90" height="${H}" fill="#8C97A6"/>`;
    s += `<path d="M0 800 H${W}" stroke="#fff" stroke-width="5" stroke-dasharray="34 26"/><path d="M1200 0 V${H}" stroke="#fff" stroke-width="5" stroke-dasharray="34 26"/>`;
    s += `<rect x="1155" y="755" width="90" height="90" fill="#8C97A6"/>`;
    for (let i = 0; i < 6; i++) s += `<rect x="${1160 + i * 15}" y="${700}" width="9" height="40" fill="#fff"/><rect x="${1160 + i * 15}" y="${862}" width="9" height="40" fill="#fff"/>`;
    // fountain at the crossing corner
    s += `<g transform="translate(1000 680)"><ellipse rx="60" ry="22" fill="#B9C3D1"/><ellipse rx="50" ry="17" fill="#7FC8F8"/><rect x="-6" y="-46" width="12" height="40" fill="#B9C3D1"/><path d="M0 -46 q-26 -6 -34 30 M0 -46 q26 -6 34 30" stroke="#BFE6FF" stroke-width="5" fill="none"/></g>`;
    // trees & flowers
    [[80, 260], [520, 300], [900, 280], [1000, 520], [1320, 240], [1900, 260], [2330, 300], [2330, 640], [60, 700], [880, 700],
     [1050, 1180], [1080, 1450], [1330, 1180], [1880, 1130], [2050, 1000], [2330, 1000], [2340, 1200], [60, 1700], [1080, 1690]].forEach(([x, y], i) => { s += tree(x, y, .85 + (i % 3) * .12); });

    s += playgroundSVG() + manegeSVG();

    // the big welcome board over the entrance road

      <rect x="-200" y="-180" width="400" height="90" rx="20" fill="#FFE38A" stroke="#B5793F" stroke-width="8"/>
      <text x="0" y="-126" text-anchor="middle" font-size="31" font-weight="700" fill="#D94C84">Defne ve Nisan'ın Şehri</text>
      <text x="-176" y="-150" font-size="22">🌸</text><text x="150" y="-150" font-size="22">⭐</text></g>`;

  // ================= Moving around =================
  const P = { x: 1200, y: 1430, face: 1, moving: false };
  const M = { x: 1170, y: 1440, face: 1, moving: false };
  const horse = { x: 1650, y: 1470 }, baby = { x: 1780, y: 1500 };
  let riding = false, activity = null, roomOpen = null, introOpen = true;
  const keys = new Set();
  let target = null, onArrive = null;

  const OBST = PLACES.map(p => ({ x: p.x - 10, y: p.y - 30, w: p.w + 20, h: p.h + 34 }));
  const blocked = (x, y) => OBST.some(r => x > r.x && x < r.x + r.w && y > r.y && y < r.y + r.h);

  // Path finding on a 20-unit grid (A*), then shortened to the fewest straight stretches.
  const CELL = 20, GW = Math.ceil(W / CELL), GH = Math.ceil(H / CELL);
  const solid = new Uint8Array(GW * GH);
  for (let gy = 0; gy < GH; gy++) for (let gx = 0; gx < GW; gx++) solid[gy * GW + gx] = blocked(gx * CELL + CELL / 2, gy * CELL + CELL / 2) ? 1 : 0;
  function clearLine(a, b) {
    const n = Math.ceil(Math.hypot(b.x - a.x, b.y - a.y) / 8);
    for (let i = 1; i <= n; i++) if (blocked(a.x + (b.x - a.x) * i / n, a.y + (b.y - a.y) * i / n)) return false;
    return true;
  }
  function findPath(from, to) {
    if (clearLine(from, to)) return [to];
    const cell = q => Math.min(GW - 1, Math.max(0, Math.floor(q.x / CELL))) + Math.min(GH - 1, Math.max(0, Math.floor(q.y / CELL))) * GW;
    const start = cell(from), goal = cell(to);
    if (solid[goal]) return [to];
    const g = new Float32Array(GW * GH).fill(Infinity), came = new Int32Array(GW * GH).fill(-1), heap = [];
    const hval = i => Math.hypot(i % GW - goal % GW, Math.floor(i / GW) - Math.floor(goal / GW));
    const push = (i, f) => { heap.push([f, i]); let k = heap.length - 1; while (k > 0) { const pk = (k - 1) >> 1; if (heap[pk][0] <= heap[k][0]) break; [heap[pk], heap[k]] = [heap[k], heap[pk]]; k = pk; } };
    const pop = () => { const top = heap[0], end = heap.pop(); if (heap.length) { heap[0] = end; let k = 0; for (;;) { const l = 2 * k + 1, r = l + 1; let m = k; if (l < heap.length && heap[l][0] < heap[m][0]) m = l; if (r < heap.length && heap[r][0] < heap[m][0]) m = r; if (m === k) break; [heap[m], heap[k]] = [heap[k], heap[m]]; k = m; } } return top; };
    g[start] = 0; push(start, hval(start));
    while (heap.length) {
      const [, i] = pop();
      if (i === goal) break;
      const x = i % GW, y = Math.floor(i / GW);
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
        if (!dx && !dy) continue;
        const nx = x + dx, ny = y + dy; if (nx < 0 || ny < 0 || nx >= GW || ny >= GH) continue;
        const j = ny * GW + nx; if (solid[j] || (dx && dy && (solid[y * GW + nx] || solid[ny * GW + x]))) continue;
        const ng = g[i] + (dx && dy ? 1.414 : 1);
        if (ng < g[j]) { g[j] = ng; came[j] = i; push(j, ng + hval(j)); }
      }
    }
    if (came[goal] < 0) return [to];
    const pts = [to];
    for (let i = came[goal]; i >= 0 && i !== start; i = came[i]) pts.unshift({ x: (i % GW) * CELL + CELL / 2, y: Math.floor(i / GW) * CELL + CELL / 2 });
    const out = []; let cur = from, k = 0;
    while (k < pts.length) {
      let far = k;
      for (let j = pts.length - 1; j > k; j--) if (clearLine(cur, pts[j])) { far = j; break; }
      out.push(pts[far]); cur = pts[far]; k = far + 1;
    }
    return out;
  }
  let route = [];
  function walkTo(x, y, cb) { route = findPath({ x: P.x, y: P.y }, { x, y }); target = route.shift(); onArrive = cb || null; }

  const world = $('#world');
  world.innerHTML = cityStatic() + `<g id="npc"></g><g id="horseG"></g><g id="babyG"></g><g id="misemG"><g id="misemFlip"></g></g><g id="playerG"><g id="playerFlip"></g></g>`;

  // Nisan stands by her house and says hello.
  const nisanPos = { x: 690, y: 1172 };
  $('#npc').innerHTML = `<g transform="translate(${nisanPos.x} ${nisanPos.y})" class="tap" data-npc="nisan">${personSVG(NISAN_LOOK)}<g id="nisanBubble"></g></g>`;

  function drawPlayer() {
    let s;
    if (riding) {
      const leg = state.look.bottom === 'broek' ? state.look.bottomColor : SKIN;
      s = `<g class="gallop">${horseSVG(DEFNE_HORSE)}
        <clipPath id="riderClip"><rect x="-60" y="-140" width="120" height="104"/></clipPath>

          <rect x="-5" y="-40" width="9" height="30" rx="4" fill="${leg}" transform="rotate(-12 0 -40)"/><ellipse cx="-4" cy="-10" rx="7" ry="4.5" fill="${state.look.shoeColor}" stroke="rgba(0,0,0,.25)"/></g></g>`;
    }
    else s = personSVG(state.look, { board: boardOn() });
    $('#playerFlip').innerHTML = s;
    const babyRide = riding ? `<g class="gallop">${horseSVG(BABY_HORSE)}<g transform="translate(-2 -76)">${misemSVG()}</g></g>` : '';
    $('#misemFlip').innerHTML = riding ? `<g transform="scale(.55)">${babyRide}</g>` : `<g class="mk">${misemSVG()}</g>`;
    $('#horseG').innerHTML = riding ? '' : `<g transform="translate(${horse.x} ${horse.y})" class="tap" data-horse="1">${horseSVG(DEFNE_HORSE)}<text x="0" y="24" text-anchor="middle" font-size="16" font-weight="700" fill="#5E3A1A">Defne's paard</text></g>`;
    $('#babyG').innerHTML = riding ? '' : `<g transform="translate(${baby.x} ${baby.y}) scale(.5)" class="tap" data-horse="1">${horseSVG(BABY_HORSE)}<text x="0" y="44" text-anchor="middle" font-size="28" font-weight="700" fill="#5E3A1A">Misem's veulen</text></g>`;
    $('#boardBtn').hidden = state.look.board === 'geen';
    $('#boardBtn').setAttribute('aria-pressed', String(boardOn()));
  }
  const boardOn = () => state.look.board !== 'geen' && state.onBoard;

  let scale = 1, cam = { x: 0, y: 0 }, vw = 0, vh = 0;
  function measure() {
    const r = $('#viewport').getBoundingClientRect();
    vw = r.width; vh = r.height;
    scale = vw < 700 ? .72 : vw < 1100 ? .9 : 1;
  }
  function camera() {
    cam.x = clamp(P.x - vw / scale / 2, 0, Math.max(0, W - vw / scale));
    cam.y = clamp(P.y - 60 - vh / scale / 2, 0, Math.max(0, H - vh / scale));
    world.setAttribute('transform', `scale(${scale}) translate(${-cam.x} ${-cam.y})`);
  }

  function step(dt) {
    if (introOpen || roomOpen || activity) return;
    let vx = 0, vy = 0;
    if (keys.size) {
      vx = (keys.has('ArrowRight') ? 1 : 0) - (keys.has('ArrowLeft') ? 1 : 0);
      vy = (keys.has('ArrowDown') ? 1 : 0) - (keys.has('ArrowUp') ? 1 : 0);
      if (vx || vy) { target = null; onArrive = null; route = []; }
    } else if (target) {
      const dx = target.x - P.x, dy = target.y - P.y, d = Math.hypot(dx, dy);
      if (d < 7) { if (route.length) target = route.shift(); else { target = null; const f = onArrive; onArrive = null; if (f) f(); } }
      else { vx = dx / d; vy = dy / d; }
    }
    const len = Math.hypot(vx, vy);
    if (len) {
      vx /= len; vy /= len;
      const sp = (riding ? 270 : boardOn() ? 280 : 175) * dt;
      let nx = P.x + vx * sp, ny = P.y + vy * sp;
      const z = ZONES.manege;
      if (riding) { nx = clamp(nx, z.x + 70, z.x + z.w - 80); ny = clamp(ny, z.y + 120, z.y + z.h - 20); }
      nx = clamp(nx, 30, W - 30); ny = clamp(ny, 110, H - 20);
      const ox = P.x, oy = P.y;
      if (!blocked(nx, ny)) { P.x = nx; P.y = ny; }
      else if (!blocked(nx, P.y)) P.x = nx;
      else if (!blocked(P.x, ny)) P.y = ny;
      if (target && Math.hypot(P.x - ox, P.y - oy) < sp * .2) { target = null; onArrive = null; route = []; }
      if (Math.abs(vx) > .2) P.face = vx < 0 ? -1 : 1;
    }
    P.moving = len > 0;
    // Misem follows a little behind.
    const tx = P.x - P.face * (riding ? 80 : 38), ty = P.y + (riding ? 30 : 6);
    const dx = tx - M.x, dy = ty - M.y, d = Math.hypot(dx, dy);
    M.moving = d > 4;
    if (M.moving) {
      const ms = Math.min(d, Math.max(150, d * 5) * dt);
      M.x += dx / d * ms; M.y += dy / d * ms;
      if (Math.abs(dx) > 2) M.face = dx < 0 ? -1 : 1;
    }
    render();
    near();
  }

  function render() {
    $('#playerG').setAttribute('transform', `translate(${P.x.toFixed(1)} ${P.y.toFixed(1)})`);
    $('#playerFlip').setAttribute('transform', `scale(${P.face} 1)`);
    $('#playerFlip').classList.toggle('walking', P.moving && !boardOn() && !riding);
    $('#misemG').setAttribute('transform', `translate(${M.x.toFixed(1)} ${M.y.toFixed(1)})`);
    $('#misemFlip').setAttribute('transform', `scale(${M.face} 1)`);

  // ================= HUD: what can be done here =================
  let hudKey = '';
  function hud(key, html) {

  }
  let lastZone = '', greeted = false;
  function inZone(z, pad = 0) { return P.x > z.x - pad && P.x < z.x + z.w + pad && P.y > z.y - pad && P.y < z.y + z.h + pad; }
  function near() {
    if (riding) return hud('ride', `<button class="act green" data-act="dismount">Afstappen 🐴</button>`);
    const door = PLACES.find(p => { const d = doorOf(p); return Math.hypot(P.x - d.x, P.y - d.y) < 60; });
    if (door) hud('door' + door.id, `<button class="act" data-act="enter" data-place="${door.id}">${door.icon} Naar binnen: ${door.name}</button>`);
    else if (Math.hypot(P.x - horse.x, P.y - horse.y) < 90) hud('horse', `<button class="act" data-act="mount">Op Defne's paard 🐴</button>`);
    else hud('', '');
    const zone = inZone(ZONES.speeltuin) ? 'speeltuin' : inZone(ZONES.manege) ? 'manege' : '';
    if (zone && zone !== lastZone) toast(zone === 'speeltuin' ? 'De speeltuin! Tik op de schommel, glijbaan, wip, draaimolen of zandbak.' : 'De manege! Ga naar Defne\'s paard en stap op.', 3200);
    lastZone = zone;
    if (!greeted && Math.hypot(P.x - nisanPos.x, P.y - nisanPos.y) < 120) { greeted = true; nisanSays('Hoi Defne! Hoi Misem!'); }

  // ================= Playground activities =================

  // ================= Input on the map =================

  }

  ROOMS.huisNisan = body => {
    const keysSvg = [0, 1, 2, 3, 4, 5, 6].map(i => `<rect class="key" data-n="${i}" x="${600 + i * 34}" y="200" width="32" height="90" rx="4" fill="#fff" stroke="#2B2B3A" stroke-width="2"/>`).join('');
    body.innerHTML = `<div class="wrap"><p class="lead">Nisan is thuis! Speel met haar speelgoed: de bal, de beer, de trommel en de piano.</p>
      <div class="panel" style="padding:8px">${roomScene(`
        <g transform="translate(300 330)">${personSVG(NISAN_LOOK)}</g>
        <g class="toy" data-t="bal"><circle cx="160" cy="330" r="34" fill="#E0483D"/><path d="M126 330 H194 M160 296 Q140 330 160 364" stroke="#fff" stroke-width="5" fill="none"/></g>
        <g class="toy" data-t="beer"><circle cx="460" cy="300" r="34" fill="#B5793F"/><circle cx="436" cy="268" r="12" fill="#B5793F"/><circle cx="484" cy="268" r="12" fill="#B5793F"/><ellipse cx="460" cy="352" rx="30" ry="26" fill="#B5793F"/><circle cx="450" cy="296" r="3.5" fill="#222"/><circle cx="470" cy="296" r="3.5" fill="#222"/><ellipse cx="460" cy="310" rx="9" ry="7" fill="#E9C99B"/></g>
        <g class="toy" data-t="trommel"><ellipse cx="80" cy="250" rx="45" ry="14" fill="#F6E7C8"/><rect x="35" y="250" width="90" height="60" fill="#5B7CFA"/><ellipse cx="80" cy="310" rx="45" ry="14" fill="#5B7CFA"/><path d="M40 255 L80 305 L120 255" stroke="#FFD23F" stroke-width="4" fill="none"/></g>
        <g><rect x="590" y="180" width="258" height="130" rx="10" fill="#2B2B3A"/>${keysSvg}<text x="719" y="170" text-anchor="middle" font-size="20" font-weight="700" fill="#5E3A1A">🎹 Piano</text></g>
        <g id="heart"></g>`, '#E9E2FF', '#C9A57A')}</div></div>`;
    body.querySelectorAll('.key').forEach(k => k.addEventListener('click', () => {
      Sommen.tones([[262, 294, 330, 349, 392, 440, 494][+k.dataset.n]], .25);
      k.setAttribute('fill', '#FFD23F'); setTimeout(() => k.setAttribute('fill', '#fff'), 200);
    }));
    body.querySelectorAll('.toy').forEach(t => t.addEventListener('click', () => {
      t.classList.remove('wiggle'); void t.getBBox(); t.classList.add('wiggle');
      if (t.dataset.t === 'bal') { t.animate([{ transform: 'translateY(0)' }, { transform: 'translateY(-80px)' }, { transform: 'translateY(0)' }], { duration: 600, easing: 'ease-out' }); SOUND.pop(); }
      if (t.dataset.t === 'beer') { $('#heart').innerHTML = `<text class="bubble" x="440" y="240" font-size="40">💖</text>`; setTimeout(() => { $('#heart').innerHTML = ''; }, 1200); SOUND.pop(); }
      if (t.dataset.t === 'trommel') [0, 180, 360].forEach(ms => later(ms, () => sweep([[0, 140], [.12, 60]], 'sine', .35)));
    }));
  };

  ROOMS.buren = body => {
    let slices = 6;
    body.innerHTML = `<div class="wrap"><p class="lead">De buurvrouw heeft taart gebakken en haar kat ligt te slapen. Tik maar!</p>
      <div class="panel" style="padding:8px">${roomScene(`
        <g transform="translate(200 360)"><rect x="-120" y="-60" width="240" height="14" rx="6" fill="#B5793F"/><rect x="-110" y="-46" width="12" height="46" fill="#8A5A2B"/><rect x="98" y="-46" width="12" height="46" fill="#8A5A2B"/>
          <g class="toy" data-t="taart"><ellipse cx="0" cy="-64" rx="70" ry="12" fill="#fff"/><g id="cake"></g></g></g>
        <g class="toy" data-t="kat" transform="translate(640 360)"><ellipse cx="0" cy="-6" rx="80" ry="22" fill="#E0483D" opacity=".8"/><g transform="scale(1.3)">${quadSVG({ body: '#4A4F57', belly: '#9AA0A8', ears: 'pointy', tail: 'long', whiskers: true, dark: '#2A2D33' })}</g><g id="zzz"><text x="70" y="-110" font-size="28">💤</text></g></g>
        <g transform="translate(470 330)"><rect x="-26" y="-10" width="52" height="40" rx="6" fill="#C8693E"/><circle cx="0" cy="-30" r="30" fill="#3E9A4A"/><circle cx="-10" cy="-40" r="7" fill="#FF6FA5"/><circle cx="12" cy="-30" r="7" fill="#FFD23F"/></g>`, '#DDF5EC', '#C9A57A')}</div></div>`;
    const cake = () => { $('#cake').innerHTML = slices ? `<path d="M-60 -64 a60 10 0 0 0 120 0 v-40 a60 10 0 0 0 -120 0 Z" fill="#FFB5CC"/><ellipse cx="0" cy="-104" rx="60" ry="10" fill="#FFE0EA"/>${[...Array(slices)].map((_, i) => `<circle cx="${-45 + i * 18}" cy="-106" r="5" fill="#E0483D"/>`).join('')}` : `<text x="-30" y="-74" font-size="26">😋</text>`; };
    cake();
    body.querySelectorAll('.toy').forEach(t => t.addEventListener('click', () => {
      t.classList.remove('wiggle'); void t.getBBox(); t.classList.add('wiggle');
      if (t.dataset.t === 'taart') { if (slices) { slices--; toast(slices ? 'Mmm, lekker! Nog ' + slices + ' stukjes.' : 'De taart is op! 😋'); SOUND.pop(); } cake(); }
      if (t.dataset.t === 'kat') { SOUND.kat(); $('#zzz').innerHTML = `<text class="bubble" x="60" y="-110" font-size="24" font-weight="700" fill="#D94C84">Miauw?</text>`; setTimeout(() => { $('#zzz').innerHTML = `<text x="70" y="-110" font-size="28">💤</text>`; }, 1500); }
    }));
  };

  // ---- 2. Skate park: a half-pipe seen from the side ----
  let skate = null;
  ROOMS.skate = body => {
    if (state.look.board === 'geen') {
      body.innerHTML = `<div class="wrap"><div class="panel" style="align-items:center;text-align:center"><p class="lead" style="font-size:1.4rem">🛹 Je hebt een skateboard nodig!</p>
        <p class="lead">Kies er een in de kledingkast in het huis van Defne. Of leen er nu een.</p><button class="big" id="lend">Leen een skateboard</button></div></div>`;
      $('#lend').addEventListener('click', () => { setLook({ board: 'ja' }); state.onBoard = true; store.set('onBoard', true); SOUND.yay(); ROOMS.skate(body); });
      return;
    }
    // u runs from -1 (left lip) to 1 (right lip); the ramp height h(u) rises from the flat middle.
    const X = u => 450 + u * 340, Hh = u => { const a = Math.abs(u); return a < .35 ? 0 : 250 * ((a - .35) / .65) ** 2; };
    const slope = u => { const a = Math.abs(u); return a < .35 ? 0 : Math.sign(u) * 500 * (a - .35) / (.65 * .65); };
    let path = '';
    for (let i = 0; i <= 100; i++) { const u = -1 + i / 50; path += (i ? 'L' : 'M') + X(u).toFixed(1) + ' ' + (380 - Hh(u)).toFixed(1); }
    body.innerHTML = `<div class="wrap"><p class="lead">Houd ◀ of ▶ ingedrukt om steeds hoger te gaan. Vlieg je boven de rand uit? Doe dan snel een trucje!</p>
      <div class="panel skate-wrap" style="padding:8px"><svg class="scene" viewBox="0 0 900 420" style="background:linear-gradient(#BFE6FF,#E8F6FF)">
        <rect x="0" y="380" width="900" height="40" fill="#9AA2B1"/>
        <path d="${path} L790 420 L110 420 Z" fill="#C7CCD6"/><path d="${path}" fill="none" stroke="#6E7685" stroke-width="8"/>
        <rect x="70" y="118" width="40" height="302" fill="#C7CCD6"/><rect x="790" y="118" width="40" height="302" fill="#C7CCD6"/>
        <path d="M70 130 H110 M790 130 H830" stroke="#E0483D" stroke-width="6"/>
        <text x="450" y="250" text-anchor="middle" font-size="48" fill="#FF6FA5" opacity=".35" font-weight="700">SKATE</text>
        <g id="sk"><g id="skRot"><g id="skBoard">${boardSVG(state.look.boardColor)}</g><g id="skBody" transform="translate(0 -8)">${personSVG(state.look, { noShadow: true })}</g></g></g>
      </svg><div id="trickMsg"></div></div>
      <div class="panel"><div class="score">Punten: <span id="skScore">0</span> · Record: <span id="skBest">${state.skateBest}</span></div>
      <div class="pump"><button class="big" id="pumpL" aria-label="Naar links">◀</button><button class="big" id="pumpR" aria-label="Naar rechts">▶</button></div>
      <div class="row"><button class="big green" data-trick="draai">🔄 Draai</button><button class="big green" data-trick="flip">🛹 Flip</button><button class="big green" data-trick="grab">✋ Grab</button></div></div></div>`;
    skate = { u: 0, v: 0, air: false, y: 0, vy: 0, side: 1, push: 0, trick: null, tt: 0, score: 0, raf: 0, last: 0, X, Hh, slope };
    const hold = (el, dir) => {
      const on = e => { e.preventDefault(); skate.push = dir; }, off = () => { if (skate.push === dir) skate.push = 0; };
      el.addEventListener('pointerdown', on); el.addEventListener('pointerup', off); el.addEventListener('pointerleave', off); el.addEventListener('pointercancel', off);
    };
    hold($('#pumpL'), -1); hold($('#pumpR'), 1);
    body.querySelectorAll('[data-trick]').forEach(b => b.addEventListener('click', () => trick(b.dataset.trick)));
    skate.keydown = e => { if (e.key === 'ArrowLeft') skate.push = -1; if (e.key === 'ArrowRight') skate.push = 1; if (e.key === 'ArrowUp' || e.key === ' ') { e.preventDefault(); trick(pick(['draai', 'flip', 'grab'])); } };
    skate.keyup = e => { if ((e.key === 'ArrowLeft' && skate.push === -1) || (e.key === 'ArrowRight' && skate.push === 1)) skate.push = 0; };
    document.addEventListener('keydown', skate.keydown); document.addEventListener('keyup', skate.keyup);
    skate.raf = requestAnimationFrame(skateLoop);
  };
  function trick(kind) {
    if (!skate) return;
    if (!skate.air) return msg('Eerst hoog vliegen!');
    if (skate.trick) return;
    skate.trick = kind; skate.tt = 0;
  }
  function msg(t) { const m = $('#trickMsg'); if (!m) return; m.innerHTML = `<div class="trick-msg">${t}</div>`; }
  function skateLoop(now) {
    const s = skate; if (!s) return;
    const dt = Math.min(.033, (now - (s.last || now)) / 1000); s.last = now;
    if (!s.air) {
      const K = .0048;
      // Holding either button pumps in the direction of travel, so speed builds up swing after swing.
      const pumpDir = s.push ? (Math.abs(s.v) < .15 ? s.push : Math.sign(s.v)) : 0;
      s.v += (-K * s.slope(s.u) + pumpDir * 1.5) * dt;
      s.v *= (1 - .25 * dt);
      s.v = clamp(s.v, -2.6, 2.6);
      s.u += s.v * dt;
      if (Math.abs(s.u) >= 1) {
        s.side = Math.sign(s.u); s.u = s.side;
        if (Math.abs(s.v) > .45) { s.air = true; s.y = 0; s.vy = Math.abs(s.v) * 300; s.v = 0; }
        else s.v = -s.v * .3;
      }
    } else {
      s.vy -= 900 * dt; s.y += s.vy * dt;
      if (s.trick) s.tt += dt / .55;
      if (s.y <= 0) {
        s.air = false; s.y = 0;
        s.v = -s.side * Math.max(.6, Math.sqrt(2 * .0048 * 250)) * .97;
        if (s.trick) {
          const ok = s.tt >= 1, pts = { draai: 100, flip: 150, grab: 80 }[s.trick];
          if (ok) { s.score += pts; msg(`${{ draai: 'Draai!', flip: 'Kickflip!', grab: 'Grab!' }[s.trick]} +${pts}`); SOUND.yay(); }
          else msg('Oeps! Te laat.');
          s.trick = null; s.tt = 0;
          $('#skScore').textContent = s.score;
          if (s.score > state.skateBest) { state.skateBest = s.score; store.set('skateBest', s.score); $('#skBest').textContent = s.score; }
        }
      }
    }
    const x = s.X(s.u), y = 380 - s.Hh(s.u) - s.y;
    const ang = s.air ? 0 : Math.atan2(-s.slope(s.u) / 340, 1) * 180 / Math.PI * -1;
    const tAng = s.trick === 'draai' ? Math.min(1, s.tt) * 360 * -s.side : 0;
    $('#sk').setAttribute('transform', `translate(${x.toFixed(1)} ${y.toFixed(1)})`);
    $('#skRot').setAttribute('transform', `rotate(${(-ang + tAng).toFixed(1)} 0 -40)`);
    $('#skBoard').setAttribute('transform', s.trick === 'flip' ? `translate(0 -4) scale(1 ${Math.cos(Math.min(1, s.tt) * Math.PI * 2).toFixed(2)}) translate(0 4)` : '');
    $('#skBody').setAttribute('transform', s.trick === 'grab' ? 'translate(0 2) scale(1 .85)' : 'translate(0 -8)');
    s.raf = requestAnimationFrame(skateLoop);
  }
  function stopSkate() {
    if (!skate) return;
    cancelAnimationFrame(skate.raf);
    document.removeEventListener('keydown', skate.keydown); document.removeEventListener('keyup', skate.keyup);
    skate = null;
  }

  // ================= Start =================
  function startCity() {
    if (!introOpen) return;
    introOpen = false; $('#intro').hidden = true;
    SOUND.yay();
    toast('Hoi Defne! Misem loopt met je mee. Waar gaan we heen?', 3200);
  }
  $('#startBtn').addEventListener('click', startCity);
  $('#soundBtn').addEventListener('click', () => { Sommen.soundOn = !Sommen.soundOn; store.set('sound', Sommen.soundOn); $('#soundBtn').textContent = Sommen.soundOn ? '🔊' : '🔇'; });
  $('#soundBtn').textContent = Sommen.soundOn ? '🔊' : '🔇';
  $('#boardBtn').addEventListener('click', () => { state.onBoard = !state.onBoard; store.set('onBoard', state.onBoard); drawPlayer(); });

  window.addEventListener('resize', () => { measure(); camera(); });
  measure(); drawPlayer(); render();
  let last = performance.now();
  (function loop(now) {
    step(Math.min(.05, (now - last) / 1000)); last = now;
    requestAnimationFrame(loop);
  })(last);
})();
</script>
</body>
</html>
