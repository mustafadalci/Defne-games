<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spelletjes van Defne</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="theme-color" content="#2F54B5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Defne">
<script src="pwa.js" defer></script>
<style>
:root {
  --paper: #FFF9F0; --ink: #33231A; --muted: #7A6455; --card: #FFFFFF; --line: #EADBCB;
  --tomato: #D63B2F; --blue: #2F54B5;
  --display: "Fredoka", "Comic Sans MS", system-ui, sans-serif; --body: "Nunito", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; font-family: var(--body); color: var(--ink); background: var(--paper);
  padding: 32px max(16px, env(safe-area-inset-left, 0px)) 32px max(16px, env(safe-area-inset-right, 0px));
}
main { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
h1 { font-family: var(--display); font-size: clamp(2rem, 7vw, 3rem); margin: 0; text-wrap: balance; }
p { margin: 0; font-size: 1.15rem; color: var(--muted); font-weight: 700; }
.games { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 18px; }
.game {
  display: flex; flex-direction: column; gap: 8px; padding: 22px; border-radius: 24px; text-decoration: none; color: inherit;
  background: var(--card); box-shadow: 0 6px 0 var(--line), 0 14px 28px rgba(60, 30, 10, .1); border: 3px solid transparent;
}
.game:hover, .game:focus-visible { border-color: currentColor; outline: none; }
.game .ico { font-size: 3.4rem; line-height: 1; }
.game strong { font-family: var(--display); font-size: 1.7rem; }
.game span { font-weight: 700; color: var(--muted); }
.pizza strong { color: var(--tomato); }
.klas strong { color: var(--blue); }
.voetbal strong { color: #1D7A3F; }
</style>
</head>
<body>
<main>
  <div>
    <h1>Spelletjes van Defne</h1>
    <p>Kies een spel. Bij elk spel ga je rekenen!</p>
  </div>
  <div class="games">
    <a class="game pizza" href="pizza.html"><span class="ico">🍕</span><strong>Pizzeria Defne</strong><span>Bak een pizza. Elke som is een stap.</span></a>
    <a class="game klas" href="klas.html"><span class="ico">🏫</span><strong>Klas van Defne</strong><span>Jij bent de juf. Richt je eigen klas in.</span></a>
    <a class="game voetbal" href="voetbal.html"><span class="ico">⚽</span><strong>Voetbalkaarten</strong><span>Verzamel alle 10 kaarten in je album.</span></a>
  </div>
</main>
</body>
</html>
